<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Segunda Sagrada · Preview Geral</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#e7c276;font-family:Arial,sans-serif}.wrap{width:min(1024px,100%);margin:auto;position:relative}.art{display:block;width:100%;height:auto}.hot{position:absolute;z-index:3;display:block}.single{left:2.5%;top:14.7%;width:47.4%;height:36.3%}.doubles{left:50.1%;top:14.7%;width:47.4%;height:36.3%}.loading{min-height:100vh;display:grid;place-items:center;letter-spacing:.16em;text-transform:uppercase;font-size:12px}.note{text-align:center;padding:18px 12px 30px;color:#9f8a64;font-size:12px}.note b{color:#d9b878}</style></head><body><div class="wrap"><div class="loading" id="loading">Carregando conceito aprovado…</div><img id="art" class="art" alt="Segunda Sagrada — Geral" hidden><a class="hot single" href="./index.html" aria-label="Entrar no Simples"></a><a class="hot doubles" href="./duplas.html" aria-label="Entrar no Duplas"></a><div class="note"><b>PREVIEW TEMPORÁRIO</b> · o Geral oficial continua inalterado.</div></div><script>Promise.all(['.tmp/hero.part1','.tmp/hero.part2','.tmp/hero.part3'].map(u=>fetch(u).then(r=>r.text()))).then(p=>{const img=document.getElementById('art');img.src='data:image/webp;base64,'+p.join('');img.hidden=false;document.getElementById('loading').remove()}).catch(()=>document.getElementById('loading').textContent='Erro ao carregar o preview');</script></body></html>
