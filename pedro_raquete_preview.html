<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafio da Raquete</title><style>:root{--bg:#0d1712;--card:#15221b;--line:#ffffff20;--txt:#f4ead7;--muted:#b7b0a6;--gold:#d9b878;--green:#2f7a4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1f3a28,#0d1712 58%);color:var(--txt);display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:min(900px,100%)}.top{text-align:center;margin-bottom:14px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-weight:800}.top h1{margin:8px 0 4px;font-family:Georgia,serif;font-size:36px}.top p{margin:0;color:var(--muted)}.game{border:1px solid var(--line);background:#ffffff08;border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #0007}.arena{display:grid;grid-template-columns:1fr 180px 1fr;min-height:360px}.side{padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.side:first-child{background:linear-gradient(145deg,#1b2a39aa,#10192322)}.side:last-child{background:linear-gradient(215deg,#3b241aaa,#1a0f0a22)}.name{font-size:24px;font-weight:900}.score{font-size:82px;font-weight:900;line-height:1}.hint{font-size:13px;color:var(--muted);text-align:center}.controls{display:none;gap:8px}.controls.show{display:flex}.mini{width:54px;height:46px;border-radius:14px;border:1px solid var(--line);background:#ffffff10;color:var(--txt);font-size:24px;font-weight:900}.center{border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}.timer{font-size:76px;font-weight:900;line-height:1}.status{text-align:center;font-weight:800;color:var(--gold);min-height:38px}.bar{width:100%;height:10px;background:#ffffff12;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#d9b878,#f4ead7);transition:width .1s linear}.mainbtn{border:0;border-radius:999px;padding:14px 20px;background:var(--gold);color:#24180d;font-weight:900;font-size:16px;cursor:pointer}.mainbtn:disabled{opacity:.5}.foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.rule{font-size:13px;color:var(--muted)}.winner{font-size:18px;font-weight:900;color:var(--gold)}@media(max-width:700px){.arena{grid-template-columns:1fr 120px 1fr;min-height:300px}.score{font-size:58px}.timer{font-size:54px}.name{font-size:18px}.side{padding:20px 10px}.center{padding:12px}.top h1{font-size:30px}}@media(max-width:520px){body{padding:8px}.arena{grid-template-columns:1fr 98px 1fr}.score{font-size:48px}.timer{font-size:44px}.hint{font-size:11px}.mainbtn{font-size:13px;padding:12px 14px}.top h1{font-size:26px}}</style></head><body><div class="wrap"><div class="top"><div class="eyebrow">Segunda Sagrada · Preview</div><h1>Desafio da Raquete 🎾</h1><p>10 segundos. Jogue a raquete no chão o máximo de vezes que conseguir.</p></div><section class="game"><div class="arena"><div class="side"><div class="name">PEDRO</div><div class="score" id="pScore">0</div><div class="hint" id="pHint">Conte seus lançamentos durante os 10s.</div><div class="controls" id="pControls"><button class="mini" onclick="changeScore('p',-1)">−</button><button class="mini" onclick="changeScore('p',1)">+</button></div></div><div class="center"><div class="status" id="status">Prontos?</div><div class="timer" id="timer">10</div><div class="bar"><div class="fill" id="fill"></div></div><button class="mainbtn" id="startBtn" onclick="startGame()">COMEÇAR</button></div><div class="side"><div class="name">VOCÊ</div><div class="score" id="yScore">0</div><div class="hint" id="yHint">Conte seus lançamentos durante os 10s.</div><div class="controls" id="yControls"><button class="mini" onclick="changeScore('y',-1)">−</button><button class="mini" onclick="changeScore('y',1)">+</button></div></div></div><div class="foot"><div class="rule">Sem som · só vale raquete que realmente bateu no chão.</div><div class="winner" id="winner"></div></div></section></div><script>let running=false,p=0,y=0;const timer=document.getElementById('timer'),statusEl=document.getElementById('status'),fill=document.getElementById('fill'),btn=document.getElementById('startBtn'),winner=document.getElementById('winner');function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function startGame(){if(running)return;running=true;p=0;y=0;updateScores();winner.textContent='';document.getElementById('pControls').classList.remove('show');document.getElementById('yControls').classList.remove('show');btn.disabled=true;fill.style.width='100%';for(const n of [3,2,1]){statusEl.textContent=n;timer.textContent='';await sleep(700)}statusEl.textContent='VALENDO!';let left=10;timer.textContent=left;const start=Date.now();await new Promise(resolve=>{const iv=setInterval(()=>{const elapsed=(Date.now()-start)/1000;left=Math.max(0,Math.ceil(10-elapsed));timer.textContent=left;fill.style.width=Math.max(0,100-(elapsed/10*100))+'%';if(elapsed>=10){clearInterval(iv);resolve()}},100)});timer.textContent='0';statusEl.textContent='PAROU!';document.getElementById('pHint').textContent='Ajuste quantas vezes o Pedro conseguiu.';document.getElementById('yHint').textContent='Ajuste quantas vezes você conseguiu.';document.getElementById('pControls').classList.add('show');document.getElementById('yControls').classList.add('show');btn.disabled=false;btn.textContent='REVANCHE';running=false;updateWinner()}function changeScore(w,d){if(running)return;if(w==='p')p=Math.max(0,p+d);else y=Math.max(0,y+d);updateScores();updateWinner()}function updateScores(){document.getElementById('pScore').textContent=p;document.getElementById('yScore').textContent=y}function updateWinner(){if(p===0&&y===0){winner.textContent='';return}winner.textContent=p===y?'EMPATE!':p>y?'PEDRO VENCEU!':'VOCÊ VENCEU!'}</script></body></html>
