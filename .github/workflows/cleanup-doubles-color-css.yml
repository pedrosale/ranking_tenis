name: Cleanup Doubles Color CSS
on:
  push:
    paths: ['.github/workflows/cleanup-doubles-color-css.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.css')
          t=p.read_text(encoding='utf-8')
          dup='.btn.doubles{background:linear-gradient(135deg,#b8904f,#765a2d)}.btn.doubles{background:linear-gradient(135deg,#b8904f,#765a2d)}'
          t=t.replace(dup,'.btn.doubles{background:linear-gradient(135deg,#b8904f,#765a2d)}')
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.css
          git rm .github/workflows/cleanup-doubles-color-css.yml
          git commit -m 'chore: remove duplicate doubles color rule'
          git push