name: Pulse Modality Dots
on:
  push:
    paths: ['.github/workflows/pulse-modality-dots.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          old='''    background: var(--green-soft);\n    box-shadow: 0 0 0 6px rgba(47,123,80,.12);\n}'''
          new='''    background: var(--green-soft);\n    box-shadow: 0 0 0 6px rgba(47,123,80,.12);\n    animation: simplePulse 1.25s ease-in-out infinite;\n    transform-origin: center;\n    will-change: transform, opacity, box-shadow;\n}\n\n@keyframes simplePulse {\n    0%, 100% { transform: scale(.82); box-shadow: 0 0 0 4px rgba(47,123,80,.10); opacity: .55; }\n    50% { transform: scale(1.28); box-shadow: 0 0 0 9px rgba(47,123,80,.08), 0 0 18px rgba(47,123,80,.65); opacity: 1; }\n}'''
          if old not in t: raise SystemExit('simple dot rule not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          p=Path('duplas.html'); t=p.read_text(encoding='utf-8')
          old='.kicker::before{content:"";width:8px;height:8px;border-radius:999px;background:#4f8dcc;box-shadow:0 0 0 6px rgba(79,141,204,.16)}'
          new='.kicker::before{content:"";width:8px;height:8px;border-radius:999px;background:#4f8dcc;box-shadow:0 0 0 6px rgba(79,141,204,.16);animation:doublesPulse 1.25s ease-in-out infinite;transform-origin:center;will-change:transform,opacity,box-shadow}@keyframes doublesPulse{0%,100%{transform:scale(.82);box-shadow:0 0 0 4px rgba(79,141,204,.10);opacity:.55}50%{transform:scale(1.28);box-shadow:0 0 0 9px rgba(79,141,204,.08),0 0 18px rgba(79,141,204,.65);opacity:1}}'
          if old not in t: raise SystemExit('doubles dot rule not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html duplas.html
          git rm .github/workflows/pulse-modality-dots.yml
          git commit -m 'style: pulse simple and doubles identity dots'
          git push