name: Update Master navigation
on:
  push:
    paths:
      - '.github/workflows/master-nav-joao-sorteio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch master navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html')
          s=p.read_text()
          old='''    <a class="nav-pill" href="#sugestoes">Próximos jogos</a>\n  </nav>'''
          new='''    <a class="nav-pill" href="#sugestoes">Próximos jogos</a>\n    <a class="nav-pill" href="./joao_ai.html">João AI</a>\n  </nav>'''
          if old not in s:
              raise SystemExit('nav anchor not found')
          s=s.replace(old,new,1)
          # Reorder via CSS so mobile/grid layout is: Ranking full; Marcel+Agenda; Proximos+Atletas+Joao AI adjusted below by explicit grid rules.
          css='''\n/* Master quick navigation — official layout */\n.header-actions{display:grid!important;grid-template-columns:repeat(6,1fr)!important;gap:10px!important}\n.header-actions .nav-pill{margin:0!important;min-width:0!important}\n.header-actions a[href="#ranking"]{grid-column:1/-1;grid-row:1}\n.header-actions a[href="https://pedrosale.github.io/ranking_tenis/marcel_balao.html"]{grid-column:1/5;grid-row:2}\n.header-actions a[href="#agenda"]{grid-column:5/7;grid-row:2}\n.header-actions a[href="#sugestoes"]{grid-column:1/3;grid-row:3}\n.header-actions a[href="#participantes"]{grid-column:3/5;grid-row:3}\n.header-actions a[href="./joao_ai.html"]{grid-column:5/7;grid-row:3}\n.header-actions a[href="./sorteio.html"]{grid-column:1/-1;grid-row:4}\n@media(max-width:520px){.header-actions{gap:8px!important}}\n'''
          marker='</style>'
          if marker not in s: raise SystemExit('style marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'href="./joao_ai.html">João AI' master.html
          grep -q 'a\[href="./sorteio.html"\].*grid-column:1/-1' master.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master.html
          git commit -m 'feat: add Joao AI and full-width Sorteio to Master'
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/master-nav-joao-sorteio.yml
          git commit -m 'chore: remove temporary master navigation workflow'
          git push
