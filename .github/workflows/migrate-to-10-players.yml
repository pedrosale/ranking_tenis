name: Migrate ranking to 10 players

on:
  push:
    paths:
      - '.github/workflows/migrate-to-10-players.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          pairs = [
              ('id="miniPlayers">0/8<', 'id="miniPlayers">0/10<'),
              ('state.players.length === 8', 'state.players.length === 10'),
              ('state.schedule.length === 28', 'state.schedule.length === 45'),
              ('state.players.length >= 8', 'state.players.length >= 10'),
              ('O limite é de 8 participantes.', 'O limite é de 10 participantes.'),
              ('${state.players.length}/8 jogadores cadastrados', '${state.players.length}/10 jogadores cadastrados'),
              ('Cadastre 8 jogadores para iniciar o torneio.', 'Cadastre 10 jogadores para iniciar o torneio.'),
              ('Jogos lançados: ${played}/28 · Pendentes: ${pending}', 'Jogos lançados: ${played}/45 · Pendentes: ${pending}'),
              ('${state.players.length}/8`', '${state.players.length}/10`'),
              ('state.players.length === 10 ? 28 : 0', 'state.players.length === 10 ? 45 : 0'),
              ('${played}/28 jogos lançados', '${played}/45 jogos lançados'),
          ]
          for old, new in pairs:
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: correct 10-player round-robin totals'
          git push
