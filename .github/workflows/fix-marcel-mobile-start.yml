name: Fix Marcel mobile controls
on:
  push:
    paths: ['.github/workflows/fix-marcel-mobile-start.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('marcel_balao.html'); s=p.read_text()
          marker='</style>'
          css='''<style>\n/* Mobile game viewport: keep all primary controls visible without scrolling */\nhtml,body{min-height:100dvh}\n.wrap{padding-bottom:calc(10px + env(safe-area-inset-bottom))}\n@media (max-width:600px){\n  .wrap{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}\n  .top{margin-bottom:5px}\n  .back,.history{padding:6px 9px;font-size:11px}\n  .score{font-size:14px}\n  .card{padding:7px;border-radius:18px}\n  h1{font-size:22px;margin:2px 4px 1px}\n  .sub{font-size:11px;line-height:1.25;margin:0 4px 5px}\n  canvas{width:auto;height:min(61dvh,650px);max-width:100%;margin:0 auto;aspect-ratio:auto}\n  .controls{gap:8px;margin-top:6px}\n  .btn{padding:10px 6px;font-size:14px}\n  .start{margin-top:6px;padding:10px;font-size:14px}\n  .tip{font-size:10px;margin:5px 4px 0}\n}\n@media (max-width:600px) and (max-height:780px){\n  .sub,.tip{display:none}\n  h1{font-size:20px}\n  canvas{height:58dvh}\n  .btn{padding:8px 5px}\n  .start{padding:9px}\n}\n</style>'''
          if marker not in s: raise SystemExit('style marker missing')
          s=s.replace(marker,marker+css,1)
          p.write_text(s)
          PY
          grep -q 'keep all primary controls visible' marcel_balao.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add marcel_balao.html
          git commit -m 'fix: keep Marcel start button visible on mobile'
          git rm .github/workflows/fix-marcel-mobile-start.yml
          git commit -m 'chore: remove temporary Marcel mobile workflow'
          git push
