name: Strengthen General Pulse
on:
  push:
    paths: ['.github/workflows/strengthen-general-pulse.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('master.css')
          t=p.read_text(encoding='utf-8')
          t=t.replace('animation:generalPulse 1.9s ease-in-out infinite}', 'animation:generalPulse 1.25s ease-in-out infinite;transform-origin:center;will-change:transform,opacity,box-shadow}')
          t=re.sub(r'@keyframes generalPulse\{[^}]*\}50%\{[^}]*\}\}', '@keyframes generalPulse{0%,100%{transform:scale(.82);box-shadow:0 0 0 4px rgba(217,184,120,.10);opacity:.55}50%{transform:scale(1.28);box-shadow:0 0 0 9px rgba(217,184,120,.08),0 0 18px rgba(217,184,120,.65);opacity:1}}', t, count=1)
          p.write_text(t,encoding='utf-8')
          p=Path('master.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'master\.css\?v=[^"\']+', 'master.css?v=20260824-pulse2', h, count=1)
          p.write_text(h,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.css master.html
          git rm .github/workflows/strengthen-general-pulse.yml
          git commit -m 'style: make general identity pulse clearly visible'
          git push