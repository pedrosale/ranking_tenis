name: Add Geral ranking share final
on:
  push:
    paths:
      - '.github/workflows/add-geral-share-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html'); t=p.read_text(encoding='utf-8')
          old='<section class="section card" id="ranking"><div class="head"><div><div class="eyebrow">03 · Ranking</div><h2>Ranking atualizado · Geral</h2></div><div class="note">Pontos e games do Simples + Duplas. Match tie-break não entra no saldo de games.</div></div>'
          new='<section class="section card" id="ranking"><div class="head"><div><div class="eyebrow">03 · Ranking</div><h2>Ranking atualizado · Geral</h2></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px"><button id="shareGeralRankingBtn" type="button" style="width:auto;margin:0;padding:7px 11px;border:1px solid rgba(217,184,120,.34);border-radius:999px;background:rgba(217,184,120,.10);color:inherit;font:800 10px Inter,Arial,sans-serif;letter-spacing:.02em;box-shadow:none;cursor:pointer">↗ Compartilhar</button><div class="note">Pontos e games do Simples + Duplas. Match tie-break não entra no saldo de games.</div></div></div>'
          if old not in t: raise SystemExit('ranking header not found')
          t=t.replace(old,new,1)
          script="""
async function shareGeralRanking(){
  const btn=document.getElementById('shareGeralRankingBtn');
  if(!btn)return;
  const oldText=btn.textContent;btn.disabled=true;btn.textContent='Gerando...';
  try{
    if(!window.html2canvas){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
    const rows=combined();
    const wrap=document.createElement('div');
    wrap.style.cssText='position:fixed;left:-10000px;top:0;width:1280px;padding:34px;background:linear-gradient(145deg,#1b120e,#241710 55%,#13261c);color:#f4ead7;font-family:Inter,Arial,sans-serif;border-radius:30px;z-index:-1';
    const today=new Date().toLocaleDateString('pt-BR');
    const body=rows.map((x,i)=>`<tr style="background:${i===0?'rgba(217,184,120,.13)':'transparent'}"><td>${i+1}</td><td style="font-weight:800">${x.player}</td><td>${x.j}</td><td>${x.v}</td><td>${x.d}</td><td>${x.gv}</td><td>${x.gs}</td><td>${x.saldo}</td><td>${x.singlePts}</td><td>${x.doublePts}</td><td style="font-weight:900">${x.total}</td></tr>`).join('');
    wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px"><div><div style="color:#d9b878;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800">Segunda Sagrada · Temporada 2026</div><div style="font-family:Georgia,serif;font-size:38px;font-weight:700;margin:6px 0">Ranking · Geral</div><div style="color:rgba(244,234,215,.72);font-size:12px">Campanha combinada de Simples + Duplas</div></div><div style="font-size:11px;color:rgba(244,234,215,.55);text-align:right">Atualizado em<br><strong>${today}</strong></div></div><div style="border:1px solid rgba(244,234,215,.12);border-radius:20px;overflow:hidden"><table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left"><thead><tr style="color:rgba(244,234,215,.55);font-size:9px;text-transform:uppercase"><th>Posição</th><th>Atleta</th><th>Jogos</th><th>Vitórias</th><th>Derrotas</th><th>Games vencidos</th><th>Games sofridos</th><th>Saldo de games</th><th>Pontos Simples</th><th>Pontos Duplas</th><th>Pontos Total</th></tr></thead><tbody>${body}</tbody></table></div><style>th,td{padding:13px 10px;border-bottom:1px solid rgba(244,234,215,.08)}tbody tr:last-child td{border-bottom:0}</style><div style="display:flex;justify-content:space-between;margin-top:18px;color:rgba(244,234,215,.48);font-size:10px"><span>Critérios: pontos totais → saldo de games → confronto direto → número de vitórias → TBD.</span><strong style="color:#d9b878;letter-spacing:.1em;text-transform:uppercase">Segunda Sagrada</strong></div>`;
    document.body.appendChild(wrap);
    const canvas=await window.html2canvas(wrap,{scale:2,backgroundColor:null,useCORS:true,logging:false});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png',1));wrap.remove();
    const file=new File([blob],'ranking-geral-segunda-sagrada.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'Ranking Geral · Segunda Sagrada'});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  }catch(e){if(e?.name!=='AbortError'){console.error(e);alert('Não foi possível gerar a imagem neste navegador.')}}finally{btn.disabled=false;btn.textContent=oldText}
}
document.getElementById('shareGeralRankingBtn')?.addEventListener('click',shareGeralRanking);
"""
          marker='async function init(){'
          if marker not in t: raise SystemExit('init marker not found')
          t=t.replace(marker,script+'\n'+marker,1)
          p.write_text(t,encoding='utf-8')
          PY
          grep -q 'shareGeralRankingBtn' master.html
          grep -q 'function shareGeralRanking' master.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'feat: add Geral ranking image sharing'
          git push
