name: Apply doubles 5-all tiebreak rule
on:
  push:
    paths: ['.github/workflows/doubles-five-all-tiebreak.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('type="number" min="0" max="7"','type="number" min="0" max="6"')
          old="function validSet(a,b){const hi=Math.max(a,b),lo=Math.min(a,b);return(hi===6&&lo<=4)||(hi===7&&(lo===5||lo===6))}"
          new="function validSet(a,b){const hi=Math.max(a,b),lo=Math.min(a,b);return hi===6&&lo<=5}"
          assert old in t
          t=t.replace(old,new,1)
          oldmsg="Set inválido. Use placares normais de tênis: 6-0 a 6-4, 7-5 ou 7-6."
          newmsg="Set inválido. Use 6-0 a 6-4; chegando a 5-5, jogue o tie-break e registre 6-5 para o vencedor. Não são aceitos 7-5 ou 7-6."
          assert oldmsg in t
          t=t.replace(oldmsg,newmsg,1)
          oldrule='<div class="rule"><b>Vencedores · 10 + games</b><p>Cada atleta da dupla vencedora recebe 10 pontos de base + 1 ponto por game vencido pela dupla nos sets.</p></div><div class="rule"><b>Perdedores · 6 + games</b><p>Cada atleta da dupla perdedora recebe 6 pontos de base + 1 ponto por game vencido pela dupla nos sets. O match tie-break decide a partida, mas seus pontos não contam como games.</p></div><div class="rule"><b>Desempate</b><p>Saldo de games dos sets, depois vitórias e ordem alfabética. Pontos do match tie-break não entram no saldo nem na pontuação por games.</p></div>'
          newrule='<div class="rule"><b>Vencedores · 10 + games</b><p>Cada atleta da dupla vencedora recebe 10 pontos de base + 1 ponto por game vencido pela dupla nos sets.</p></div><div class="rule"><b>Perdedores · 6 + games</b><p>Cada atleta da dupla perdedora recebe 6 pontos de base + 1 ponto por game vencido pela dupla nos sets. Chegando a 5×5 em um set, joga-se o tie-break e o set é registrado 6×5 para o vencedor; 7×5 e 7×6 não são permitidos. Se os sets ficarem 1×1, o match tie-break decide a partida, mas seus pontos não contam como games.</p></div><div class="rule"><b>Desempate</b><p>Saldo de games dos sets, depois vitórias e ordem alfabética. Tie-breaks apenas decidem o set ou a partida: seus pontos não entram no saldo nem na pontuação por games.</p></div>'
          assert oldrule in t
          t=t.replace(oldrule,newrule,1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/doubles-five-all-tiebreak.yml
          git commit -m 'feat: use tiebreak at five-all in doubles'
          git push