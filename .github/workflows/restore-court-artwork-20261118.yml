name: Restore Segunda Sagrada court artwork
on:
  push:
    paths:
      - '.github/workflows/restore-court-artwork-20261118.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 2 --max-time 30 --silent --show-error 'https://wnlqmlhmbiboedxhquvf.supabase.co/storage/v1/object/public/assets/segunda-sagrada-geral.png' -o assets/segunda-sagrada-geral.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/segunda-sagrada-geral.png')
          b=p.read_bytes()
          if len(b)<50000 or not b.startswith(bytes.fromhex('89504e470d0a1a0a')):
              raise SystemExit('Original PNG unavailable or invalid; site remains unchanged')
          print('PNG validated:',len(b),'bytes')
          PY
      - name: Point Master to local image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('master.html')
          s=p.read_text()
          old='https://wnlqmlhmbiboedxhquvf.supabase.co/storage/v1/object/public/assets/segunda-sagrada-geral.png?v=1'
          assert s.count(old)==1,'Expected image reference not found exactly once'
          p.write_text(s.replace(old,'./assets/segunda-sagrada-geral.png?v=20261118'))
          PY
          git diff --check
      - name: Publish image and HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/segunda-sagrada-geral.png master.html
          git commit -m 'fix: host original court artwork locally'
          git push
