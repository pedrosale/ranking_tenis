name: Fix doubles render
on:
  push:
    paths: ['.github/workflows/fix-duplas-render.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old=";const n=nextSuggestion();nextMatch.innerHTML=n?`<strong>${n.match.a.join(' + ')} x ${n.match.b.join(' + ')}</strong><small>${fmt(n.date)} · quatro atletas disponíveis</small>`:'Nenhum confronto disponível nas próximas quartas.';"
          if old not in t: raise SystemExit('stale nextMatch render not found')
          t=t.replace(old,';',1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/fix-duplas-render.yml
          git commit -m 'fix: restore doubles ranking and schedule render'
          git push