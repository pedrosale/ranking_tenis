name: Add Marcel game button

on:
  push:
    paths:
      - '.github/workflows/add-marcel-button.yml'

permissions:
  contents: write

jobs:
  patch-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert Marcel game button
        shell: python
        run: |
          from pathlib import Path
          p = Path('master.html')
          s = p.read_text(encoding='utf-8')
          old = '    <a class="nav-pill" href="#agenda">Agenda</a>\n    <a class="nav-pill" href="#sugestoes">Próximos jogos</a>'
          new = '    <a class="nav-pill" href="#agenda">Agenda</a>\n    <a class="nav-pill" href="./marcel_balao.html">Jogue balão com o Marcel</a>\n    <a class="nav-pill" href="#sugestoes">Próximos jogos</a>'
          if 'href="./marcel_balao.html"' in s:
              print('Button already present; nothing to do.')
          else:
              if old not in s:
                  raise SystemExit('Expected navigation block not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          grep -q 'href="./marcel_balao.html">Jogue balão com o Marcel</a>' master.html
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- master.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'feat: add Marcel balloon game to main navigation'
          git push origin main
