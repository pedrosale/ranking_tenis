name: Add Marcel game button

on:
  push:
    paths:
      - '.github/workflows/add-marcel-button.yml'

permissions:
  contents: write

jobs:
  patch-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make Marcel game open outside PWA
        shell: python
        run: |
          from pathlib import Path
          p = Path('master.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="nav-pill" href="./marcel_balao.html">Jogue balão com o Marcel</a>'
          new = '<a class="nav-pill" href="https://pedrosale.github.io/ranking_tenis/marcel_balao.html" target="_blank" rel="noopener">Jogue balão com o Marcel</a>'
          if new in s:
              print('External Marcel link already present.')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Marcel navigation link not found')
      - name: Validate
        shell: bash
        run: |
          grep -q 'href="https://pedrosale.github.io/ranking_tenis/marcel_balao.html" target="_blank" rel="noopener"' master.html
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- master.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'fix: open Marcel game outside standalone app'
          git push origin main
