name: Add Simple Rules Nav
on:
  push:
    paths: ['.github/workflows/add-simple-rules-nav.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='''                    <a class="nav-pill" href="#historico">Histórico</a>\n'''
          new='''                    <a class="nav-pill" href="#historico">Histórico</a>\n                    <a class="nav-pill" href="#pontuacao">Regras</a>\n'''
          if old not in t: raise SystemExit('history nav not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-simple-rules-nav.yml
          git commit -m 'style: add rules button to simple nav'
          git push