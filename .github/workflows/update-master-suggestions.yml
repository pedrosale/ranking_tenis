name: Update Master Suggestions
on:
  push:
    paths:
      - '.github/workflows/update-master-suggestions.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add suggestions to master
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html')
          t=p.read_text(encoding='utf-8')

          t=t.replace('.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px}', '.suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.suggest-list{display:grid;gap:9px}.suggest-item{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.12)}.suggest-item strong{display:block;margin-bottom:4px}.suggest-item small{color:var(--muted)}.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px}')
          t=t.replace('@media(max-width:850px){.hero-stats{grid-template-columns:1fr 1fr}.leader-grid,.apps{grid-template-columns:1fr}', '@media(max-width:850px){.hero-stats{grid-template-columns:1fr 1fr}.leader-grid,.suggest-grid,.apps{grid-template-columns:1fr}')

          marker='''<section class="section card">\n<div class="head"><div><div class="eyebrow">06 · Modalidades</div><h2>Entrar em quadra</h2></div><div class="note">O Master é o hub. Os resultados continuam sendo lançados dentro de cada modalidade.</div></div>'''
          insert='''<section class="section card">\n<div class="head"><div><div class="eyebrow">06 · Próximos jogos</div><h2>Sugestões por disponibilidade</h2></div><div class="note">Sugestões automáticas usando as quartas disponíveis e apenas confrontos ainda pendentes.</div></div>\n<div class="suggest-grid">\n  <div class="app-card"><div class="eyebrow">Simples</div><h3>Próximos confrontos</h3><div class="suggest-list" id="singleSuggestions"></div></div>\n  <div class="app-card"><div class="eyebrow">Duplas</div><h3>Próximos confrontos</h3><div class="suggest-list" id="doubleSuggestions"></div></div>\n</div>\n</section>\n\n<section class="section card">\n<div class="head"><div><div class="eyebrow">07 · Modalidades</div><h2>Entrar em quadra</h2></div><div class="note">O Master é o hub. Os resultados continuam sendo lançados dentro de cada modalidade.</div></div>'''
          if marker not in t: raise SystemExit('modalities marker not found')
          t=t.replace(marker,insert,1)

          js_marker='''function renderPlayers(){'''
          js_insert='''const DOUBLES_TEMPLATE=[[[0,2],[7,8]],[[0,3],[2,7]],[[0,4],[6,9]],[[0,5],[6,8]],[[0,6],[5,9]],[[0,7],[5,8]],[[0,8],[2,9]],[[0,9],[5,6]],[[1,2],[4,9]],[[1,3],[4,8]],[[1,4],[3,9]],[[1,5],[4,7]],[[1,6],[3,8]],[[1,7],[4,6]],[[1,8],[3,7]],[[1,9],[3,6]],[[2,4],[3,5]],[[2,5],[3,4]],[[2,6],[5,7]],[[2,8],[7,9]]];\nfunction available(p,date){return single.availability?.[p]?.[date]!==false}\nfunction getSingleSuggestions(limit=5){\n  const played=new Set((single.matches||[]).map(m=>m.id));\n  let pending=(single.schedule||[]).filter(m=>!played.has(m.id));\n  const count={};(single.players||[]).forEach(p=>count[p]=(single.matches||[]).filter(m=>m.playerA===p||m.playerB===p).length);\n  const out=[];\n  for(const date of visibleDates()){\n    const possible=pending.filter(m=>available(m.playerA,date)&&available(m.playerB,date)).sort((a,b)=>(count[a.playerA]+count[a.playerB])-(count[b.playerA]+count[b.playerB]));\n    const m=possible[0]; if(!m)continue;\n    out.push({date,label:m.playerA+' x '+m.playerB});\n    pending=pending.filter(x=>x.id!==m.id);count[m.playerA]++;count[m.playerB]++;\n    if(out.length>=limit)break;\n  }\n  return out;\n}\nfunction doublesSchedule(){return (single.players||[]).length===10?DOUBLES_TEMPLATE.map((x,i)=>({id:'D'+(i+1),a:x[0].map(k=>single.players[k]),b:x[1].map(k=>single.players[k])})):[]}\nfunction getDoubleSuggestions(limit=5){\n  const played=new Set((doubles.matches||[]).map(m=>m.id));let pending=doublesSchedule().filter(m=>!played.has(m.id));const out=[];\n  for(const date of visibleDates()){\n    const m=pending.find(x=>[...x.a,...x.b].every(p=>available(p,date)));if(!m)continue;\n    out.push({date,label:m.a.join(' + ')+' x '+m.b.join(' + ')});pending=pending.filter(x=>x.id!==m.id);if(out.length>=limit)break;\n  }return out;\n}\nfunction renderSuggestions(){\n  const render=(arr,empty)=>arr.length?arr.map(x=>`<div class="suggest-item"><strong>${x.label}</strong><small>${fmt(x.date)}</small></div>`).join(''):`<div class="note">${empty}</div>`;\n  singleSuggestions.innerHTML=render(getSingleSuggestions(),'Nenhum confronto de simples disponível.');\n  doubleSuggestions.innerHTML=render(getDoubleSuggestions(),'Nenhum confronto de duplas disponível.');\n}\n\nfunction renderPlayers(){'''
          if js_marker not in t: raise SystemExit('renderPlayers marker not found')
          t=t.replace(js_marker,js_insert,1)

          t=t.replace('renderRanking();renderPlayers();renderAgenda();renderStats()', 'renderRanking();renderPlayers();renderAgenda();renderSuggestions();renderStats()')
          t=t.replace('renderRanking();renderPlayers();renderAgenda();renderStats();', 'renderRanking();renderPlayers();renderAgenda();renderSuggestions();renderStats();')

          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'Sugestões por disponibilidade' master.html
          grep -q 'function getSingleSuggestions' master.html
          grep -q 'function getDoubleSuggestions' master.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'feat: add match suggestions to master'
          git push
# retrigger
