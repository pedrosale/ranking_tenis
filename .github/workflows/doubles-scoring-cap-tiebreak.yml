name: Update doubles scoring cap and tiebreak
on:
  push:
    paths:
      - '.github/workflows/doubles-scoring-cap-tiebreak.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('duplas.html'); t=p.read_text(encoding='utf-8')

          # Cap each normal set at six games for scoring and game balance.
          t2,n=re.subn(
            r"gamesA=m\.s1a\+m\.s2a,gamesB=m\.s1b\+m\.s2b,pointsWin=10\+\(m\.winnerSide==='A'\?gamesA:gamesB\),pointsLose=6\+\(m\.winnerSide==='A'\?gamesB:gamesA\)",
            "gamesA=Math.min(6,+m.s1a)+Math.min(6,+m.s2a),gamesB=Math.min(6,+m.s1b)+Math.min(6,+m.s2b),pointsWin=10+(m.winnerSide==='A'?gamesA:gamesB),pointsLose=6+(m.winnerSide==='A'?gamesB:gamesA)",t,count=1)
          if n!=1: raise SystemExit('duplas scoring expression not found')
          t=t2

          # Existing ranking uses athlete key `name`; add direct head-to-head before wins.
          helper="""function directHeadToHead(aName,bName){let a=0,b=0;for(const m of playedMatches()){const as=m.a.includes(aName)?'A':(m.b.includes(aName)?'B':null),bs=m.a.includes(bName)?'A':(m.b.includes(bName)?'B':null);if(!as||!bs||as===bs)continue;if(m.winnerSide===as)a++;else if(m.winnerSide===bs)b++;}return a-b;}\n"""
          if 'function directHeadToHead(' not in t:
            marker='function renderRanking'
            if marker not in t: raise SystemExit('renderRanking not found')
            t=t.replace(marker,helper+marker,1)

          # Match actual compact comparator variants.
          patterns=[
            (r"b\.pts-a\.pts\|\|b\.saldo-a\.saldo\|\|b\.wins-a\.wins\|\|a\.name\.localeCompare\(b\.name\)","b.pts-a.pts||b.saldo-a.saldo||-directHeadToHead(a.name,b.name)||b.wins-a.wins||a.name.localeCompare(b.name)"),
            (r"b\.pontos-a\.pontos\|\|b\.saldo-a\.saldo\|\|b\.vitorias-a\.vitorias\|\|a\.nome\.localeCompare\(b\.nome\)","b.pontos-a.pontos||b.saldo-a.saldo||-directHeadToHead(a.nome,b.nome)||b.vitorias-a.vitorias||a.nome.localeCompare(b.nome)")]
          changed=False
          for pat,repl in patterns:
            t2,n=re.subn(pat,repl,t,count=1)
            if n: t=t2;changed=True;break
          if not changed: raise SystemExit('ranking comparator not found')

          old='Cada atleta da dupla vencedora recebe 10 pontos de base + 1 ponto por game vencido pela dupla nos sets.'
          new=old[:-1]+', com máximo de 6 games pontuáveis por set.'
          if old in t:t=t.replace(old,new,1)
          old='Cada atleta da dupla perdedora recebe 6 pontos de base + 1 ponto por game vencido pela dupla nos sets. O match tie-break decide a partida, mas seus pontos não contam como games.'
          new='Cada atleta da dupla perdedora recebe 6 pontos de base + 1 ponto por game vencido pela dupla nos sets, com máximo de 6 games pontuáveis por set. O match tie-break decide a partida, mas seus pontos não contam como games.'
          if old in t:t=t.replace(old,new,1)
          old='Saldo de games dos sets, depois vitórias e ordem alfabética. Pontos do match tie-break não entram no saldo nem na pontuação por games.'
          new='Em empate de pontos: saldo de games; depois confronto direto; depois número de vitórias; e, por fim, critério TBD. O match tie-break não entra no saldo nem na pontuação por games.'
          if old not in t: raise SystemExit('rule text not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          # Keep Geral's doubles calculation identical.
          p=Path('master.html'); t=p.read_text(encoding='utf-8')
          t2,n=re.subn(r"ga=\+m\.s1a \+ \+m\.s2a,gb=\+m\.s1b \+ \+m\.s2b,wp=10\+\(m\.winnerSide==='A'\?ga:gb\),lp=6\+\(m\.winnerSide==='A'\?gb:ga\)","ga=Math.min(6,+m.s1a)+Math.min(6,+m.s2a),gb=Math.min(6,+m.s1b)+Math.min(6,+m.s2b),wp=10+(m.winnerSide==='A'?ga:gb),lp=6+(m.winnerSide==='A'?gb:ga)",t,count=1)
          if n!=1: raise SystemExit('master doubles scoring expression not found')
          p.write_text(t2,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html master.html
          git commit -m 'feat: cap doubles game points and revise tiebreaks'
          git push
