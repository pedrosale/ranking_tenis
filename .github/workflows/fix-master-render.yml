name: Fix Master Render
on:
  push:
    paths:
      - '.github/workflows/fix-master-render.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix master render
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html')
          t=p.read_text(encoding='utf-8')
          old="function render(){renderRanking();renderAgenda()}"
          new="function render(){renderRanking();renderPlayers();renderAgenda();renderSuggestions()}"
          if old not in t:
              raise SystemExit('render marker not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'renderRanking();renderPlayers();renderAgenda();renderSuggestions()' master.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'fix: render inherited players and suggestions in master'
          git push
