name: Move Marcel Top 5
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Top 5 button to header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('marcel_balao.html')
          s=p.read_text()
          old='<div class="top"><a class="back" href="./master.html">← Geral</a><div class="score">DEVOLUÇÕES: <span id="score">0</span></div></div>'
          new='<div class="top"><a class="back" href="./master.html">← Geral</a><div style="display:flex;align-items:center;gap:8px"><button class="history" id="history">🏆 Top 5</button><div class="score">DEVOLUÇÕES: <span id="score">0</span></div></div></div>'
          if old not in s:
              raise SystemExit('header pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('<button class="history" id="history">🏆 Resultados passados · Top 5</button>','',1)
          s=s.replace('.history{display:block;width:100%;margin-top:9px;text-align:center;color:#fff;padding:11px}', '.history{display:inline-block;width:auto;margin:0;text-align:center;color:#fff;padding:8px 10px;font-size:11px;white-space:nowrap}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'id="history">🏆 Top 5' marcel_balao.html
          test "$(grep -o 'id="history"' marcel_balao.html | wc -l)" -eq 1
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/move-marcel-top5.yml
          git add marcel_balao.html .github/workflows/move-marcel-top5.yml
          git commit -m "fix: keep Marcel Top 5 visible in header"
          git push
