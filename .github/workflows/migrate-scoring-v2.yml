name: Finalize scoring migration

on:
  push:
    paths:
      - '.github/workflows/migrate-scoring-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining participant copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Cadastre 8 jogadores para iniciar', 'Cadastre 10 jogadores para iniciar')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove stale 8-player copy' || exit 0
          git push
