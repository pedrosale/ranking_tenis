name: Migrate scoring rules v2

on:
  push:
    paths:
      - '.github/workflows/migrate-scoring-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update scoring rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          t = t.replace('O ranking combina resultado da partida, volume de games vencidos e critérios de desempate.', 'Pontuação por resultado, com saldo de games como primeiro critério de desempate.')
          t = t.replace('<div class="rule-number">10</div>\n                    <div>\n                        <strong>Vitória</strong>\n                        <span>O vencedor recebe 10 pontos fixos pela vitória, além dos games vencidos na partida.</span>', '<div class="rule-number">3</div>\n                    <div>\n                        <strong>Vitória normal</strong>\n                        <span>Em resultados de 8x0 até 8x6, o vencedor recebe 3 pontos e o perdedor recebe 0.</span>')
          t = t.replace('<div class="rule-number">6</div>\n                    <div>\n                        <strong>Derrota</strong>\n                        <span>O perdedor recebe 6 pontos fixos pela participação, além dos games vencidos na partida.</span>', '<div class="rule-number">2/1</div>\n                    <div>\n                        <strong>Vitória no tie-break</strong>\n                        <span>Se a partida chegar a 7x7, o resultado final é 8x7: vencedor recebe 2 pontos e perdedor recebe 1.</span>')
          t = t.replace('<div class="rule-number">+</div>\n                    <div>\n                        <strong>Games também contam</strong>\n                        <span>Exemplo: em um jogo 9x7, o vencedor soma 19 pontos no total; o perdedor soma 13 pontos.</span>', '<div class="rule-number">8</div>\n                    <div>\n                        <strong>Formato do placar</strong>\n                        <span>Resultados válidos: 8x0 a 8x6 ou 8x7. O sistema bloqueia placares fora desse formato.</span>')
          t = t.replace('Em caso de empate em pontos, o sistema considera confronto direto, saldo de games, número de vitórias e, por fim, ordem alfabética.', 'Em caso de empate em pontos, vence quem tiver maior saldo de games; depois, maior número de vitórias e, por fim, ordem alfabética.')

          t = t.replace('''    if (!matchId) return alert("Selecione um confronto.");\n    if (scoreA === scoreB) return alert("Tênis não permite empate no resultado final.");\n    if (scoreA < 0 || scoreB < 0) return alert("Os games não podem ser negativos.");''', '''    if (!matchId) return alert("Selecione um confronto.");\n    if (scoreA < 0 || scoreB < 0) return alert("Os games não podem ser negativos.");\n\n    const winnerScore = Math.max(scoreA, scoreB);\n    const loserScore = Math.min(scoreA, scoreB);\n    const validScore = winnerScore === 8 && loserScore >= 0 && loserScore <= 7;\n\n    if (!validScore) {\n        return alert("Placar inválido. Use 8x0 até 8x6 ou 8x7 em caso de tie-break.");\n    }''')

          t = t.replace('''        if (match.scoreA > match.scoreB) {\n            A.vitorias++;\n            B.derrotas++;\n            A.pontos += 10;\n            B.pontos += 6;\n        } else {\n            B.vitorias++;\n            A.derrotas++;\n            B.pontos += 10;\n            A.pontos += 6;\n        }\n\n        A.pontos += match.scoreA;\n        B.pontos += match.scoreB;''', '''        const isTieBreak = Math.min(match.scoreA, match.scoreB) === 7;\n        const winnerPoints = isTieBreak ? 2 : 3;\n        const loserPoints = isTieBreak ? 1 : 0;\n\n        if (match.scoreA > match.scoreB) {\n            A.vitorias++;\n            B.derrotas++;\n            A.pontos += winnerPoints;\n            B.pontos += loserPoints;\n        } else {\n            B.vitorias++;\n            A.derrotas++;\n            B.pontos += winnerPoints;\n            A.pontos += loserPoints;\n        }''')

          t = t.replace('''        if (b.pontos !== a.pontos) return b.pontos - a.pontos;\n\n        const direct = directConfrontation(a.player, b.player);\n        if (direct) return direct;\n\n        if (b.saldo !== a.saldo) return b.saldo - a.saldo;''', '''        if (b.pontos !== a.pontos) return b.pontos - a.pontos;\n        if (b.saldo !== a.saldo) return b.saldo - a.saldo;''')

          required = ['winnerPoints = isTieBreak ? 2 : 3', 'loserPoints = isTieBreak ? 1 : 0', 'Placar inválido', 'maior saldo de games']
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit(f'Migration failed, missing: {missing}')

          p.write_text(t, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8').replace('segunda-sagrada-v2', 'segunda-sagrada-v3')
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'feat: update tennis scoring rules'
          git push

# trigger: 2
