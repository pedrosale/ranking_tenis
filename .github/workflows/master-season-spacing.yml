name: Improve Master season spacing
on:
  push:
    paths: ['.github/workflows/master-season-spacing.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('master.html'); s=p.read_text()
          s=s.replace('.season-nav-label{margin:3px 0 10px;', '.season-nav-label{margin:24px 0 12px;',1)
          s=s.replace('@media(max-width:520px){.universe-nav{padding:13px 11px}', '@media(max-width:520px){.season-nav-label{margin-top:22px}.universe-nav{padding:13px 11px}',1)
          p.write_text(s)
          PY
          grep -q 'season-nav-label{margin:24px 0 12px' master.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master.html
          git commit -m 'style: add breathing room before season navigation'
          git rm .github/workflows/master-season-spacing.yml
          git commit -m 'chore: remove temporary spacing workflow'
          git push
