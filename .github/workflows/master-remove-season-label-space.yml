name: Clean Master season label and spacing
on:
  push:
    paths: ['.github/workflows/master-remove-season-label-space.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('master.html'); s=p.read_text()
          s=s.replace('  <div class="season-nav-label">🎾 Temporada 2026</div>\n','',1)
          # navigation gets explicit breathing room after the court image
          s=s.replace('.header-actions{display:grid!important;', '.header-actions{display:grid!important;margin-top:36px!important;',1)
          # remove obsolete label styling
          s=s.replace('.season-nav-label{margin:24px 0 12px;color:var(--gold-soft);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}\n','')
          s=s.replace('.season-nav-label{margin-top:22px}','')
          p.write_text(s)
          PY
          ! grep -q '<div class="season-nav-label">' master.html
          grep -q 'margin-top:36px' master.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master.html
          git commit -m 'style: remove redundant season label and increase nav spacing'
          git rm .github/workflows/master-remove-season-label-space.yml
          git commit -m 'chore: remove temporary Master cleanup workflow'
          git push
