name: Remove password from individual result deletion
on:
  push:
    paths: ['.github/workflows/no-password-single-delete.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old="async function deleteDoublesMatch(id){const senha=prompt('Digite a senha de administrador:');if(senha!=='adminsagrada'){alert('Senha incorreta.');return}if(!confirm('Excluir este resultado de duplas?'))return;"
          new="async function deleteDoublesMatch(id){if(!confirm('Excluir este resultado de duplas?'))return;"
          if old not in t:
              raise SystemExit('deleteDoublesMatch password block not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/no-password-single-delete.yml
          git commit -m 'fix: allow deleting individual doubles result without password'
          git push