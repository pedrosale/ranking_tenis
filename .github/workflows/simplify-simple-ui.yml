name: Simplify Simple UI
on:
  push:
    paths: ['.github/workflows/simplify-simple-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          t=t.replace('                    <a class="nav-pill" href="#agenda">Agenda</a>\n','').replace('                    <a class="nav-pill" href="#participantes">Atletas</a>\n','')
          t=re.sub(r'\n\s*<section class="availability-arena" id="agenda">.*?</section>\n','\n',t,count=1,flags=re.S)
          t=re.sub(r'\n\s*<section class="content-grid">\s*<section class="subtle-section">\s*<div class="section-head">\s*<div>\s*<div class="section-eyebrow">04 · Próximos jogos</div>.*?</section>\s*(<section class="subtle-section" id="historico">)',r'\n        <section class="content-grid">\n            \1',t,count=1,flags=re.S)
          t=re.sub(r'\n\s*<section class="content-grid" style="margin-top:18px;">\s*<section class="subtle-section" id="participantes">.*?</section>\s*(<section class="subtle-section admin-section">)',r'\n        <section class="content-grid" style="margin-top:18px;">\n            \1',t,count=1,flags=re.S)
          t=t.replace('05 · Memória','03 · Memória',1).replace('06 · Regra do jogo','04 · Regra do jogo',1).replace('08 · Administração','05 · Administração',1)
          t=t.replace('    renderAvailability();\n','').replace('    renderSuggestions();\n','').replace('    renderPlayers();\n','')
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/simplify-simple-ui.yml
          git commit -m 'refactor: centralize shared controls in master'
          git push
# trigger