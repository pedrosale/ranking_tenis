name: Remove redundant doubles next match
on:
  push:
    paths: ['.github/workflows/remove-duplas-next.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old='<section class="grid" id="lancar"><div class="card"><div class="section-eyebrow">01 · Operação</div><h2>Lançar resultado</h2>'
          t=t.replace(old,'<section class="card" id="lancar" style="margin-bottom:18px"><div class="section-eyebrow">01 · Operação</div><h2>Lançar resultado</h2>',1)
          marker='<div class="status" id="saveStatus">Match tie-break só é usado quando os sets terminarem 1×1.</div></div><div class="card"><div class="section-eyebrow">02 · Próximos jogos</div><h2>Próximo confronto sugerido</h2><div id="nextMatch" class="match">Aguardando os 10 atletas do Simples.</div><p>A sugestão usa a disponibilidade das quartas compartilhada com o Simples e exige os quatro atletas disponíveis.</p></div></section>'
          repl='<div class="status" id="saveStatus">Match tie-break só é usado quando os sets terminarem 1×1.</div></section>'
          if marker not in t: raise SystemExit('next-match block not found')
          t=t.replace(marker,repl,1)
          t=t.replace('03 · Ranking','02 · Ranking',1).replace('04 · Grade','03 · Grade',1).replace('05 · Memória','04 · Memória',1).replace('06 · Regra do jogo','05 · Regra do jogo',1).replace('07 · Administração','06 · Administração',1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/remove-duplas-next.yml
          git commit -m 'refactor: keep doubles suggestions only in master'
          git push