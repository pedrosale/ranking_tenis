name: Joao sorteio followup
on:
  push:
    paths: ['.github/workflows/joao-sorteio-followup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('joao_ai.html'); s=p.read_text()
          old='<button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button>'
          new='<button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button>'
          assert old in s; s=s.replace(old,new,1)
          old2='O motor respeita as regras e evita jogos já realizados.<br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>'
          new2='O motor respeita as regras e evita jogos já realizados.<br><br><button class="chip" type="button" onclick="ask(\'sorteio\')">Como funciona o sorteio?</button><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>'
          assert old2 in s; s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          rm .github/workflows/joao-sorteio-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add joao_ai.html .github/workflows/joao-sorteio-followup.yml
          git commit -m 'feat: surface sorteio follow-up in Joao AI'
          git push
