name: Align deletion authentication policy
on:
  push:
    paths: ['.github/workflows/no-password-delete-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old="document.querySelectorAll('.delete-match-btn').forEach(btn=>btn.onclick=async()=>{const senha=prompt('Digite a senha de administrador:');if(senha!=='adminsagrada'){alert('Senha incorreta.');return}if(!confirm('Excluir este resultado de duplas?'))return;"
          new="document.querySelectorAll('.delete-match-btn').forEach(btn=>btn.onclick=async()=>{if(!confirm('Excluir este resultado de duplas?'))return;"
          if old not in t:
              raise SystemExit('doubles individual delete auth block not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/no-password-delete-v2.yml
          git commit -m 'fix: require password only for full resets'
          git push