name: Fix doubles post-save render
on:
  push:
    paths: ['.github/workflows/fix-doubles-post-save-render.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old="await setDoc(doublesRef,doubles);for(const id of['s1a','s1b','s2a','s2b','tba','tbb'])document.getElementById(id).value=''"
          new="try{await setDoc(doublesRef,doubles);render();saveStatus.textContent='Resultado salvo com sucesso.'}catch(e){saveStatus.textContent='Erro ao salvar: '+e.message;alert('Não foi possível salvar o resultado.');return}for(const id of['s1a','s1b','s2a','s2b','tba','tbb'])document.getElementById(id).value=''"
          if old not in t:
              raise SystemExit('save snippet not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/fix-doubles-post-save-render.yml
          git commit -m 'fix: refresh doubles ranking and history after save'
          git push