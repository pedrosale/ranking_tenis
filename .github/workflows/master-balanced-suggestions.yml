name: Master Balanced Suggestions
on:
  push:
    paths: ['.github/workflows/master-balanced-suggestions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html'); t=p.read_text(encoding='utf-8')
          start=t.index('function renderSuggestions(){')
          end=t.index('\n\nfunction renderPlayers(){', start)
          new=r'''function getBalancedConflictFreeSuggestions(limit=5){
  const playedSingle=new Set((single.matches||[]).map(m=>m.id));
  const playedDouble=new Set((doubles.matches||[]).map(m=>m.id));
  let pendingSingle=(single.schedule||[]).filter(m=>!playedSingle.has(m.id));
  let pendingDouble=doublesSchedule().filter(m=>!playedDouble.has(m.id));
  const singleCount={},doubleCount={};
  (single.players||[]).forEach(p=>{singleCount[p]=0;doubleCount[p]=0});
  for(const m of single.matches||[]){if(m.playerA in singleCount)singleCount[m.playerA]++;if(m.playerB in singleCount)singleCount[m.playerB]++}
  for(const m of doubles.matches||[]){if(!Array.isArray(m.a)||!Array.isArray(m.b))continue;for(const p of [...m.a,...m.b])if(p in doubleCount)doubleCount[p]++}
  const scoreSingle=m=>singleCount[m.playerA]+singleCount[m.playerB];
  const scoreDouble=m=>[...m.a,...m.b].reduce((s,p)=>s+(doubleCount[p]||0),0);
  const singles=[],doublesOut=[];
  for(const date of visibleDates()){
    const ss=pendingSingle.filter(m=>available(m.playerA,date)&&available(m.playerB,date)).sort((a,b)=>scoreSingle(a)-scoreSingle(b));
    const dd=pendingDouble.filter(m=>[...m.a,...m.b].every(p=>available(p,date))).sort((a,b)=>scoreDouble(a)-scoreDouble(b));
    let best=null;
    for(const d of [null,...dd])for(const s of [null,...ss]){
      if(!d&&!s)continue;
      const dPlayers=d?[...d.a,...d.b]:[],sPlayers=s?[s.playerA,s.playerB]:[];
      if(d&&s&&sPlayers.some(p=>dPlayers.includes(p)))continue;
      const games=(d?1:0)+(s?1:0),athletes=dPlayers.length+sPlayers.length;
      const fairness=(d?scoreDouble(d):0)+(s?scoreSingle(s):0);
      const candidate={d,s,games,athletes,fairness};
      if(!best||candidate.games>best.games||candidate.games===best.games&&candidate.athletes>best.athletes||candidate.games===best.games&&candidate.athletes===best.athletes&&candidate.fairness<best.fairness)best=candidate;
    }
    if(!best)continue;
    if(best.d&&doublesOut.length<limit){doublesOut.push({date,label:best.d.a.join(' + ')+' x '+best.d.b.join(' + ')});pendingDouble=pendingDouble.filter(x=>x.id!==best.d.id);for(const p of [...best.d.a,...best.d.b])doubleCount[p]++}
    if(best.s&&singles.length<limit){singles.push({date,label:best.s.playerA+' x '+best.s.playerB});pendingSingle=pendingSingle.filter(x=>x.id!==best.s.id);singleCount[best.s.playerA]++;singleCount[best.s.playerB]++}
    if(singles.length>=limit&&doublesOut.length>=limit)break;
  }
  return{singles,doubles:doublesOut};
}
function renderSuggestions(){
  const render=(arr,empty)=>arr.length?arr.map(x=>`<div class="suggest-item"><strong>${x.label}</strong><small>${fmt(x.date)}</small></div>`).join(''):`<div class="note">${empty}</div>`;
  const plan=getBalancedConflictFreeSuggestions();
  singleSuggestions.innerHTML=render(plan.singles,'Nenhum confronto de simples disponível sem conflito.');
  doubleSuggestions.innerHTML=render(plan.doubles,'Nenhum confronto de duplas disponível sem conflito.');
}'''
          t=t[:start]+new+t[end:]
          t=t.replace('Sugestões automáticas usando as quartas disponíveis e apenas confrontos ainda pendentes.','Sugestões automáticas respeitando disponibilidade, confrontos pendentes e equilíbrio de jogos. Na mesma data, nenhum atleta aparece em mais de uma sugestão entre Simples e Duplas.',1)
          p.write_text(t,encoding='utf-8')
          PY
          grep -q 'getBalancedConflictFreeSuggestions' master.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git commit -m 'feat: balance conflict-free master suggestions'
          git push