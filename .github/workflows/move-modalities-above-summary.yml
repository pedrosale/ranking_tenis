name: Move Modalities Above Summary
on:
  push:
    paths: ['.github/workflows/move-modalities-above-summary.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('master.html'); t=p.read_text(encoding='utf-8')
          old='''  <div class="hero-stats">\n    <div class="stat"><strong id="playersStat">0/10</strong><span>atletas</span></div>\n    <div class="stat"><strong id="singleGamesStat">0</strong><span>jogos de simples</span></div>\n    <div class="stat"><strong id="doubleGamesStat">0</strong><span>jogos de duplas</span></div>\n    <div class="stat"><strong id="totalPointsStat">0</strong><span>pontos distribuídos</span></div>\n  </div>\n</section>\n<section class="section card" id="modalidades"><div class="head"><div><div class="eyebrow">Modalidades</div><h2>Entrar em quadra</h2></div><div class="note">Os resultados continuam sendo lançados dentro de cada modalidade.</div></div><div class="apps"><div class="app-card"><div class="eyebrow">Individual</div><h3>Simples</h3><p>Confrontos, placares, ranking específico e histórico.</p><a class="btn" href="./index.html">Abrir Simples</a></div><div class="app-card"><div class="eyebrow">Parcerias</div><h3>Duplas</h3><p>Grade sorteada, sets, match tie-break e ranking individual.</p><a class="btn doubles" href="./duplas.html">Abrir Duplas</a></div></div></section>'''
          new='''  <div class="hero-side">\n    <section class="hero-modalities" id="modalidades">\n      <div class="hero-modalities-head"><div><div class="eyebrow">Modalidades</div><h2>Entrar em quadra</h2></div></div>\n      <div class="hero-apps">\n        <div class="hero-app-card"><div class="eyebrow">Individual</div><h3>Simples</h3><a class="btn" href="./index.html">Abrir Simples</a></div>\n        <div class="hero-app-card"><div class="eyebrow">Parcerias</div><h3>Duplas</h3><a class="btn doubles" href="./duplas.html">Abrir Duplas</a></div>\n      </div>\n    </section>\n    <div class="hero-stats">\n      <div class="stat"><strong id="playersStat">0/10</strong><span>atletas</span></div>\n      <div class="stat"><strong id="singleGamesStat">0</strong><span>jogos de simples</span></div>\n      <div class="stat"><strong id="doubleGamesStat">0</strong><span>jogos de duplas</span></div>\n      <div class="stat"><strong id="totalPointsStat">0</strong><span>pontos distribuídos</span></div>\n    </div>\n  </div>\n</section>'''
          if old not in t: raise SystemExit('target layout not found')
          t=t.replace(old,new,1)
          t=re.sub(r'master\.css\?v=[^"\']+', 'master.css?v=20260824-modalities-top', t, count=1)
          p.write_text(t,encoding='utf-8')
          p=Path('master.css'); c=p.read_text(encoding='utf-8')
          c=c.replace('grid-template-areas:"kicker stats" "title stats" "motto stats" "copy stats" "nav stats";', 'grid-template-areas:"kicker side" "title side" "motto side" "copy side" "nav side";')
          c=c.replace('.hero-stats{grid-area:stats;', '.hero-side{grid-area:side;display:grid;gap:12px;align-self:stretch}.hero-modalities{padding:18px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(160deg,rgba(255,248,236,.09),rgba(255,248,236,.025));box-shadow:var(--shadow-soft);position:relative;z-index:1}.hero-modalities-head h2{margin:5px 0 12px;font-size:18px}.hero-apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-app-card{padding:13px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.12)}.hero-app-card h3{font-family:"Playfair Display",Georgia,serif;font-size:24px;margin:5px 0 10px}.hero-app-card .btn{min-height:42px;font-size:13px}.hero-stats{')
          c=c.replace('@media(max-width:980px){.hero{grid-template-columns:1fr;grid-template-areas:"kicker" "title" "motto" "copy" "nav" "stats"}', '@media(max-width:980px){.hero{grid-template-columns:1fr;grid-template-areas:"kicker" "title" "motto" "copy" "nav" "side"}')
          c += '@media(max-width:520px){.hero-apps{grid-template-columns:1fr}}\n'
          p.write_text(c,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html master.css
          git rm .github/workflows/move-modalities-above-summary.yml
          git commit -m 'layout: move modalities above general summary'
          git push
# trigger