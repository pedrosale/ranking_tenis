name: Fix Joao avatar cache
on:
  push:
    paths:
      - '.github/workflows/fix-joao-avatar-cache.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update avatar cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('arbitro-preview.html')
          t = p.read_text(encoding='utf-8')
          old = './assets/joao-ai-final.svg?v=1'
          new = './assets/joao-ai-final.svg?v=3'
          if old not in t:
              raise SystemExit('avatar reference not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-joao-avatar-cache.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arbitro-preview.html .github/workflows/fix-joao-avatar-cache.yml
          git commit -m 'fix: bust Joao AI avatar cache'
          git push
