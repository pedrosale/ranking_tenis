name: Blue Doubles Save Button
on:
  push:
    paths: ['.github/workflows/blue-save-doubles.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html'); t=p.read_text(encoding='utf-8')
          old='button{margin-top:12px;background:linear-gradient(135deg,#2c714b,#173f2a);border:0;font-weight:900;color:#fff8ec;box-shadow:0 14px 30px rgba(0,0,0,.24)}'
          new='button{margin-top:12px;background:linear-gradient(135deg,#3f79b8,#214b7a);border:0;font-weight:900;color:#fff8ec;box-shadow:0 14px 30px rgba(0,0,0,.24)}'
          if old not in t: raise SystemExit('button rule not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/blue-save-doubles.yml
          git commit -m 'style: make doubles save action blue'
          git push
# trigger