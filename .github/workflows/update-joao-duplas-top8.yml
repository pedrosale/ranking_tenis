name: Update Joao AI doubles finals top 8
on:
  push:
    paths:
      - '.github/workflows/update-joao-duplas-top8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Joao AI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('joao_ai.html')
          s=p.read_text()
          old='<strong>👥 DUPLAS</strong><br><br>A Grande Final de Duplas terá uma dinâmica diferente. Os atletas classificados para as finais serão separados entre <strong>Série Ouro e Série Prata</strong>, e as <strong>duplas serão definidas por sorteio</strong> entre os classificados de cada série.'
          new='<strong>👥 DUPLAS</strong><br><br>Ao fim da fase classificatória, os <strong>8 primeiros colocados do ranking de Duplas</strong> avançam para as finais e são divididos em duas séries, de acordo com a posição final na tabela.<br><br><strong>🥇 Série Ouro — 1º ao 4º colocado</strong><br><strong>🥈 Série Prata — 5º ao 8º colocado</strong><br><br>A Grande Final de Duplas terá uma dinâmica diferente. Os <strong>8 atletas classificados</strong> serão separados entre <strong>Série Ouro e Série Prata</strong>, e as <strong>duplas serão definidas por sorteio</strong> entre os classificados de cada série.'
          if old not in s:
              raise SystemExit('Target text not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q '8 primeiros colocados do ranking de Duplas' joao_ai.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('joao_ai.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/joao.js').write_text(js)
          PY
          node --check /tmp/joao.js
      - name: Commit target change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add joao_ai.html
          git commit -m 'feat: clarify top 8 doubles finalists in Joao AI'
          git push origin main
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/update-joao-duplas-top8.yml
          git commit -m 'chore: remove temporary Joao AI update workflow'
          git push origin main
