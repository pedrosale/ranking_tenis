name: Force Master navigation gap
on:
  push:
    paths: ['.github/workflows/master-force-nav-gap.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('master.html'); s=p.read_text()
          # Use padding on the actual nav wrapper; unlike margin, this cannot collapse or be neutralized by the imported layout rule.
          anchor='/* Master quick navigation — Temporada */'
          rule='''/* Definitive separation between modality hero and season tools */\n.hero.integrated-hero>.header-actions{padding-top:36px!important;margin-top:0!important}\n@media(max-width:520px){.hero.integrated-hero>.header-actions{padding-top:36px!important}}\n\n'''
          if rule not in s:
              s=s.replace(anchor,rule+anchor,1)
          p.write_text(s)
          PY
          grep -q 'padding-top:36px!important' master.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master.html
          git commit -m 'fix: enforce visible gap before season tools'
          git rm .github/workflows/master-force-nav-gap.yml
          git commit -m 'chore: remove temporary nav gap workflow'
          git push
