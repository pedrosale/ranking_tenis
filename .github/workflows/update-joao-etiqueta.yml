name: Update Joao etiquette rules
on:
  push:
    paths:
      - '.github/workflows/update-joao-etiqueta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch etiquette answer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('joao_ai.html')
          s=p.read_text()
          old="else if(x==='etiqueta')a='<strong>🎾 Regras de etiqueta</strong><br><br>É proibido:<br>• arrotar no toss;<br>• deitar na quadra;<br>• falar <strong>acabou</strong> antes de acabar;<br>• pisar na bolinha.';"
          new="else if(x==='etiqueta')a='<strong>🎾 Regras de etiqueta</strong><br><br>É proibido:<br>• arrotar no toss;<br>• deitar na quadra;<br>• falar <strong>acabou</strong> antes de acabar;<br>• fingir que machucou;<br>• pisar na bolinha;<br>• falar durante o jogo do amiguinho.<br><br><strong>Quem estiver assistindo ao jogo deve ajudar com as bolinhas.</strong>';"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'fingir que machucou' joao_ai.html
          grep -q 'ajudar com as bolinhas' joao_ai.html
          rm .github/workflows/update-joao-etiqueta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add joao_ai.html .github/workflows/update-joao-etiqueta.yml
          git commit -m 'feat: expand Joao AI etiquette rules'
          git push
