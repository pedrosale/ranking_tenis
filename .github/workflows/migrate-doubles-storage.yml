name: Migrate doubles storage
on:
  push:
    paths: ['.github/workflows/migrate-doubles-storage.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("let single={players:[],availability:{}},doubles={matches:[]},doublesRef;","let single={players:[],availability:{},doublesMatches:[]},doubles={matches:[]},singleRef;")
          t=t.replace("try{await setDoc(doublesRef,doubles);render();saveStatus.textContent='Resultado salvo com sucesso.'}","try{single.doublesMatches=doubles.matches;await setDoc(singleRef,single);render();saveStatus.textContent='Resultado salvo com sucesso.'}")
          t=t.replace("doubles={matches:[]};await setDoc(doublesRef,doubles);alert('Resultados de duplas resetados com sucesso.')","doubles={matches:[]};single.doublesMatches=[];await setDoc(singleRef,single);render();alert('Resultados de duplas resetados com sucesso.')")
          old="try{const cfg=await loadFirebaseConfig(),app=initializeApp(cfg,'duplas-root'),db=getFirestore(app),singleRef=doc(db,'tennisRanking','main');doublesRef=doc(db,'tennisDoubles','main');onSnapshot(singleRef,s=>{if(s.exists()){single=s.data();single.players=single.players||[];single.availability=single.availability||{};render()}});onSnapshot(doublesRef,s=>{doubles=s.exists()?s.data():{matches:[]};doubles.matches=doubles.matches||[];render()})}catch(e){saveStatus.textContent='Erro ao carregar: '+e.message}"
          new="try{const cfg=await loadFirebaseConfig(),app=initializeApp(cfg,'duplas-root'),db=getFirestore(app);singleRef=doc(db,'tennisRanking','main');onSnapshot(singleRef,s=>{single=s.exists()?s.data():{players:[],availability:{},doublesMatches:[]};single.players=single.players||[];single.availability=single.availability||{};single.doublesMatches=single.doublesMatches||[];doubles={matches:single.doublesMatches};render()})}catch(e){saveStatus.textContent='Erro ao carregar: '+e.message}"
          if old not in t: raise SystemExit('duplas init block not found')
          t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')

          p=Path('master.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("let single={players:[],schedule:[],matches:[],availability:{}},doubles={matches:[]},singleRef,doublesRef;","let single={players:[],schedule:[],matches:[],availability:{},doublesMatches:[]},doubles={matches:[]},singleRef;")
          t=t.replace("doubles={matches:[]};await setDoc(doublesRef,doubles);alert('Resultados de Duplas resetados.')","doubles={matches:[]};single.doublesMatches=[];await setDoc(singleRef,single);alert('Resultados de Duplas resetados.')")
          t=t.replace("single={players:[],schedule:[],matches:[],availability:{}};doubles={matches:[]};await Promise.all([setDoc(singleRef,single),setDoc(doublesRef,doubles)]);alert('Temporada resetada.')","single={players:[],schedule:[],matches:[],availability:{},doublesMatches:[]};doubles={matches:[]};await setDoc(singleRef,single);alert('Temporada resetada.')")
          old="try{const cfg=await loadConfig(),app=initializeApp(cfg,'master-clean'),db=getFirestore(app);singleRef=doc(db,'tennisRanking','main');doublesRef=doc(db,'tennisDoubles','main');onSnapshot(singleRef,s=>{single=s.exists()?s.data():{players:[],schedule:[],matches:[],availability:{}};single.players=single.players||[];single.schedule=single.schedule||[];single.matches=single.matches||[];single.availability=single.availability||{};render()});onSnapshot(doublesRef,s=>{doubles=s.exists()?s.data():{matches:[]};doubles.matches=doubles.matches||[];render()})}catch(e){agendaStatus.textContent='Erro ao carregar dados: '+e.message}"
          new="try{const cfg=await loadConfig(),app=initializeApp(cfg,'master-clean'),db=getFirestore(app);singleRef=doc(db,'tennisRanking','main');onSnapshot(singleRef,s=>{single=s.exists()?s.data():{players:[],schedule:[],matches:[],availability:{},doublesMatches:[]};single.players=single.players||[];single.schedule=single.schedule||[];single.matches=single.matches||[];single.availability=single.availability||{};single.doublesMatches=single.doublesMatches||[];doubles={matches:single.doublesMatches};render()})}catch(e){agendaStatus.textContent='Erro ao carregar dados: '+e.message}"
          if old not in t: raise SystemExit('master init block not found')
          t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html master.html
          git rm .github/workflows/migrate-doubles-storage.yml
          git commit -m 'fix: persist doubles in authorized ranking document'
          git push