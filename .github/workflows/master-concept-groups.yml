name: Group Master navigation concepts
on:
  push:
    paths: ['.github/workflows/master-concept-groups.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('master.html'); s=p.read_text()
          css='''\n/* Concept navigation: Universo SS + Temporada */\n.universe-nav{margin:6px 0 18px;padding:17px;border:1px solid rgba(217,184,120,.32);border-radius:22px;background:linear-gradient(135deg,rgba(217,184,120,.10),rgba(217,184,120,.025))}\n.concept-label{color:var(--gold-soft);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin:0 0 10px}\n.universe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}\n.universe-card{min-width:0;text-decoration:none;color:inherit;border:1px solid rgba(217,184,120,.28);border-radius:17px;padding:13px 9px;background:rgba(255,255,255,.025);text-align:center;display:flex;flex-direction:column;gap:4px;justify-content:center}\n.universe-card strong{font-size:13px}.universe-card span{font-size:10px;line-height:1.3;opacity:.68}\n.season-nav-label{margin:3px 0 10px;color:var(--gold-soft);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}\n@media(max-width:520px){.universe-nav{padding:13px 11px}.universe-grid{gap:7px}.universe-card{padding:11px 5px}.universe-card strong{font-size:11px}.universe-card span{font-size:9px}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          start=s.index('<a class="news-feature" href="./news.html"')
          end=s.index('<section class="hero integrated-hero">',start)
          universe='''<section class="universe-nav" aria-label="Universo Segunda Sagrada">\n  <div class="concept-label">✨ Universo Segunda Sagrada</div>\n  <div class="universe-grid">\n    <a class="universe-card" href="./news.html"><strong>📰 News</strong><span>Capas e momentos</span></a>\n    <a class="universe-card" href="./hall_of_fame.html"><strong>🏆 Hall da Fama</strong><span>Campeões e história</span></a>\n    <a class="universe-card" href="./arcade_ss.html"><strong>🎮 Arcade SS</strong><span>Jogos e desafios</span></a>\n  </div>\n</section>\n'''
          s=s[:start]+universe+s[end:]
          nav_start=s.index('<nav class="header-actions"')
          nav_end=s.index('</nav>',nav_start)+6
          nav='''<div class="season-nav-label">🎾 Temporada 2026</div>\n  <nav class="header-actions" aria-label="Navegação da temporada">\n    <a class="nav-pill" href="#modalidades">Modalidades</a>\n    <a class="nav-pill" href="#ranking">Ranking Geral</a>\n    <a class="nav-pill" href="#agenda">Agenda</a>\n    <a class="nav-pill" href="#sugestoes">Próximos jogos</a>\n    <a class="nav-pill" href="#participantes">Atletas</a>\n    <a class="nav-pill" href="./joao_ai.html">João AI</a>\n    <a class="nav-pill" href="./sorteio.html">Sorteio</a>\n  </nav>'''
          s=s[:nav_start]+nav+s[nav_end:]
          # Replace old explicit grid rules with operational-only layout.
          a=s.index('/* Master quick navigation — official layout */')
          b=s.index('@media(max-width:520px){.header-actions{gap:8px!important}}',a)+len('@media(max-width:520px){.header-actions{gap:8px!important}}')
          rules='''/* Master quick navigation — Temporada */\n.header-actions{display:grid!important;grid-template-columns:repeat(6,1fr)!important;gap:10px!important}\n.header-actions .nav-pill{margin:0!important;min-width:0!important}\n.header-actions a[href="#ranking"]{grid-column:1/5;grid-row:1}\n.header-actions a[href="#agenda"]{grid-column:5/7;grid-row:1}\n.header-actions a[href="#sugestoes"]{grid-column:1/3;grid-row:2}\n.header-actions a[href="#participantes"]{grid-column:3/5;grid-row:2}\n.header-actions a[href="./joao_ai.html"]{grid-column:5/7;grid-row:2}\n.header-actions a[href="./sorteio.html"]{grid-column:1/-1;grid-row:3}\n@media(max-width:520px){.header-actions{gap:8px!important}}'''
          s=s[:a]+rules+s[b:]
          p.write_text(s)
          PY
          grep -q 'Universo Segunda Sagrada' master.html
          grep -q 'Hall da Fama' master.html
          grep -q 'Temporada 2026' master.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master.html
          git commit -m 'feat: separate Universo SS from season navigation'
          git rm .github/workflows/master-concept-groups.yml
          git commit -m 'chore: remove temporary navigation workflow'
          git push
