name: Finalize Product Identity Cleanup
on:
  push:
    paths: ['.github/workflows/harmonize-product-identity.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          rule='.section-eyebrow{color:var(--gold-soft);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;margin-bottom:6px}'
          t=t.replace(rule+rule, rule)
          p.write_text(t,encoding='utf-8')

          p=Path('index.html')
          t=p.read_text(encoding='utf-8').replace('Cada participante pode desmarcar a data em que não puder jogar.','Cada atleta pode desmarcar a data em que não puder jogar.')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html duplas.html
          git rm .github/workflows/harmonize-product-identity.yml
          git commit -m 'chore: finalize product identity harmonization'
          git push