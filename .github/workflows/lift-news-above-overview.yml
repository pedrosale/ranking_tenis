name: Lift News above overview
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move News card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('master.html')
          t = p.read_text(encoding='utf-8')
          start = t.index('<a class="news-feature"')
          end = t.index('</a>', start) + len('</a>')
          block = t[start:end]
          t = t[:start] + t[end:]
          marker = '<section class="hero integrated-hero">'
          pos = t.index(marker)
          t = t[:pos] + block + '\n' + t[pos:]
          p.write_text(t, encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add master.html
          git commit -m "Move News above overview"
          git push
