name: Fix Joao followup JS
on:
  push:
    paths: ['.github/workflows/fix-joao-followup-js.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('joao_ai.html')
          s=p.read_text()
          broken='onclick="ask(\'sorteio\')"'
          fixed='onclick="ask(&quot;sorteio&quot;)"'
          assert broken in s
          s=s.replace(broken,fixed,1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('joao_ai.html').read_text()
          script=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/joao.js').write_text(script)
          PY
          node --check /tmp/joao.js
          rm .github/workflows/fix-joao-followup-js.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add joao_ai.html .github/workflows/fix-joao-followup-js.yml
          git commit -m 'fix: restore Joao AI question responses'
          git push
