name: Reorder Doubles Navigation
on:
  push:
    paths: ['.github/workflows/reorder-doubles-nav.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duplas.html')
          t=p.read_text(encoding='utf-8')
          old='<nav class="header-actions" aria-label="Navegação principal"><a class="nav-pill" href="./master.html">← Voltar para Geral</a><a class="nav-pill" href="#lancar">Lançar resultado</a><a class="nav-pill" href="#ranking">Ranking</a><a class="nav-pill" href="#grade">Grade</a><a class="nav-pill" href="#historico">Histórico</a><a class="nav-pill" href="#regras">Regras</a></nav>'
          new='<nav class="header-actions" aria-label="Navegação principal"><a class="nav-pill" href="./master.html">← Voltar para Geral</a><a class="nav-pill" href="#ranking">Ranking</a><a class="nav-pill" href="#lancar">Lançar resultado</a><a class="nav-pill" href="#historico">Histórico</a><a class="nav-pill" href="#regras">Regras</a><a class="nav-pill" href="#grade">Grade</a></nav>'
          if old not in t: raise SystemExit('doubles nav not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplas.html
          git rm .github/workflows/reorder-doubles-nav.yml
          git commit -m 'style: align doubles navigation order'
          git push