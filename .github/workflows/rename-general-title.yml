name: Rename General Title
on:
  push:
    paths: ['.github/workflows/rename-general-title.yml']
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('master.html')
          t=p.read_text(encoding='utf-8')
          old='<h1>Geral</h1>'
          new='<h1>Segunda Sagrada - Geral</h1>'
          if old not in t:
              raise SystemExit('general title not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add master.html
          git rm .github/workflows/rename-general-title.yml
          git commit -m 'copy: rename general heading'
          git push