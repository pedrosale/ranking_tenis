name: Final Language Cleanup
on:
  push:
    paths: ['.github/workflows/final-language-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          pairs={
            'index.html':[
              ('Adicionar jogador','Adicionar atleta'),
              ('Informe o nome do jogador.','Informe o nome do atleta.'),
              ('Este jogador já foi cadastrado.','Este atleta já foi cadastrado.'),
              ('Cada participante pode desmarcar a data em que não puder jogar.','Cada atleta pode desmarcar a data em que não puder jogar.')
            ],
            'master.html':[
              ('placeholder="Nome do jogador"','placeholder="Nome do atleta"'),
              ('>Adicionar jogador</button>','>Adicionar atleta</button>'),
              ('0/10 jogadores cadastrados','0/10 atletas cadastrados'),
              ("+'/10 jogadores cadastrados'","+'/10 atletas cadastrados'"),
              ('Informe o nome do jogador.','Informe o nome do atleta.'),
              ('Este jogador já foi cadastrado.','Este atleta já foi cadastrado.')
            ],
            'duplas.html':[
              ('Aguardando os 10 atletas do Single.','Aguardando os 10 atletas do Simples.')
            ]
          }
          for fn,repls in pairs.items():
            p=Path(fn); t=p.read_text(encoding='utf-8')
            for a,b in repls:t=t.replace(a,b)
            p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html master.html duplas.html
          git rm .github/workflows/final-language-cleanup.yml
          git commit -m 'copy: finalize athlete terminology across modules'
          git push
# trigger