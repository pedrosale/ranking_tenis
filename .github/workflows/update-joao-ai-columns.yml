name: Update Joao AI Questions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-joao-ai-columns.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorganize questions and add court-hours answer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('joao_ai.html')
          s=p.read_text()
          s=s.replace('.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:11px 14px;cursor:pointer;font-weight:700}', '.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip-col{display:flex;flex-direction:column;gap:8px}.chip{padding:11px 14px;cursor:pointer;font-weight:700;text-align:left}@media(max-width:640px){.chips{grid-template-columns:1fr 1fr;gap:8px}.chip{padding:10px 11px;font-size:12px}}')
          old='<div class="chips"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="finais">Como serão as finais?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="gerais">Quais são as regras gerais?</button></div>'
          new='<div class="chips"><div class="chip-col"><button class="chip" data-q="gerais">Quais são as regras gerais?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="finais">Como serão as finais?</button></div><div class="chip-col"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="quadra">Que horas posso ir lá quadra?</button></div></div>'
          if old not in s:
              raise SystemExit('questions block not found')
          s=s.replace(old,new,1)
          s=s.replace("gerais:'Quais são as regras gerais?'", "gerais:'Quais são as regras gerais?',quadra:'Que horas posso ir lá quadra?'")
          marker="else if(x==='gerais')a="
          insert="else if(x==='quadra')a='<strong>Pergunta pro Renato.</strong>';"
          if insert not in s:
              s=s.replace(marker, insert+marker,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'data-q="quadra"' joao_ai.html
          grep -q "Pergunta pro Renato" joao_ai.html
          grep -q 'class="chip-col"' joao_ai.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-joao-ai-columns.yml
          git add joao_ai.html .github/workflows/update-joao-ai-columns.yml
          git commit -m "feat: reorganize Joao AI questions in two columns"
          git push
