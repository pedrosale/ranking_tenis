<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segunda Sagrada · João AI</title><style>:root{--cream:#f4ead7;--muted:#b9ad9f;--gold:#d9b878;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--cream);background:linear-gradient(145deg,#17110d,#241611 48%,#102419)}.wrap{max-width:820px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;margin-bottom:14px}.brand,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.badge,.chip,.draw{border:1px solid #d9b87855;background:#d9b87812;color:var(--cream);border-radius:999px}.badge{padding:8px 11px;font-size:11px}.card{border:1px solid var(--line);border-radius:26px;background:#ffffff0b;overflow:hidden}.hero{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:22px;border-bottom:1px solid var(--line)}.avatar{width:120px;height:120px;border-radius:24px;object-fit:cover;border:1px solid #d9b87855}h1{font-family:Georgia,serif;font-size:34px;margin:8px 0}.sub{color:var(--muted);line-height:1.5}.quick{padding:18px 18px 6px}.quick h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:11px 14px;cursor:pointer;font-weight:700}.chat{padding:14px 18px 22px}.msg{display:flex;margin:10px 0}.user{justify-content:flex-end}.bubble{max-width:94%;padding:13px 15px;border-radius:18px;line-height:1.55;border:1px solid var(--line)}.user .bubble{background:#4f8dcc29}.bot .bubble{background:#1f5f3b21}strong{color:#f6ddb0}.steps{padding-left:20px}.steps li{margin:7px 0}.draw{display:inline-block;margin-top:12px;padding:10px 14px;color:var(--gold);text-decoration:none;font-weight:800}.note{padding:0 18px 20px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:560px){.hero{grid-template-columns:82px 1fr}.avatar{width:82px;height:82px;border-radius:18px}h1{font-size:29px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Segunda Sagrada · Preview</div><div class="badge">João AI</div></div><section class="card"><div class="hero"><img class="avatar" alt="João AI" src="./assets/joao-ai-final.svg?v=1"><div><div class="eyebrow">João AI</div><h1>Fala comigo 🎾</h1><p class="sub">Posso orientar a rodada e explicar as regras da Segunda Sagrada.</p></div></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="gerais">Quais são as regras gerais?</button></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Fala! Eu sou o João AI. Escolhe uma pergunta aí 👇</div></div></div><div class="note">João AI · Segunda Sagrada</div></section></div><script>const c=document.getElementById('chat');function add(t,w='bot'){let r=document.createElement('div');r.className='msg '+w;r.innerHTML='<div class="bubble">'+t+'</div>';c.appendChild(r);r.scrollIntoView({behavior:'smooth'})}const Q={jogos:'Quem vai jogar hoje?',horario:'Qual horário dos jogos?',simples:'Qual regra de pontuação do Simples?',duplas:'Qual regra de pontuação de Duplas?',sorteio:'Como funciona o sorteio?',gerais:'Quais são as regras gerais?'};function ask(x){add(Q[x],'user');let a='';if(x==='jogos')a='<strong>Primeiro, descubra quem pode jogar hoje.</strong><br><br>Se não for uma quarta-feira, pergunte no grupo quem está disponível. Se for quarta-feira, pode ir direto para o Sorteio: ele usa a disponibilidade cadastrada na Agenda oficial.<br><br>Sabendo quem está disponível, <strong>use o Sorteio para definir a rodada.</strong><ol class="steps"><li>Abra o Sorteio.</li><li>Escolha a data.</li><li>Escolha Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolha a composição.</li><li>Confira os atletas disponíveis.</li><li>Se quiser, desmarque manualmente quem não vai participar.</li><li>Toque na sacolinha.</li></ol>O motor respeita as regras e evita jogos já realizados.<br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';else if(x==='horario')a='<strong>Rodada Simples</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br>Jogo 03 — 21h<br><br><strong>Rodada Duplas</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h30<br><br><strong>Rodada Mista (Simples/Duplas)</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br><br><strong>Para qualquer formato:</strong><br>Respeitem os <strong>5 minutos de aquecimento</strong>.<br>Em caso de atraso, a regra é <strong>10 minutos de tolerância + 5 minutos de aquecimento</strong>.<br><br>Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os participantes trocas na ordem dos jogos, desde que isso <strong>não atrase a agenda geral</strong>.';else if(x==='gerais')a='<strong>Regras gerais da rodada</strong><br><br>• Respeitem os <strong>5 minutos de aquecimento</strong> antes de cada jogo.<br>• Em caso de atraso, há <strong>10 minutos de tolerância</strong> e, depois, os <strong>5 minutos de aquecimento</strong>.<br>• Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os demais participantes uma troca na ordem dos jogos, desde que a mudança <strong>não atrase a agenda geral da rodada</strong>.<br>• A organização dos jogos deve preservar os horários previstos e o bom andamento da rodada.';else if(x==='simples')a='<strong>Simples — como funciona a pontuação</strong><br><br>• <strong>Vencedor:</strong> 10 pontos-base + 1 ponto por game vencido.<br>• <strong>Perdedor:</strong> 6 pontos-base + 1 ponto por game vencido.<br><br><strong>Exemplo sem tie-break:</strong><br>8×5 → vencedor: 10 + 8 = <strong>18 pontos</strong>; perdedor: 6 + 5 = <strong>11 pontos</strong>.<br><br><strong>Exemplo decidido no tie-break:</strong><br>8×7 → vencedor: 10 + 8 = <strong>18 pontos</strong>; perdedor: 6 + 7 = <strong>13 pontos</strong>.<br><br>Se o tie-break terminar, por exemplo, <strong>7×5</strong> ou <strong>10×8</strong>, esses pontos internos servem apenas para decidir o tie-break: eles <strong>não são somados como games extras</strong>. Para o ranking, vale o placar oficial em games da partida. Assim, em um 8×7 decidido no tie-break, a pontuação final continua sendo <strong>18 × 13</strong>.';else if(x==='duplas')a='<strong>Duplas — regra oficial do sistema</strong><br><br><strong>Vencedores · 10 + games</strong><br>Cada atleta da dupla vencedora recebe <strong>10 pontos de base + 1 ponto por game vencido pela dupla nos sets</strong>, com máximo de <strong>6 games pontuáveis por set</strong>.<br><br><strong>Perdedores · 6 + games</strong><br>Cada atleta da dupla perdedora recebe <strong>6 pontos de base + 1 ponto por game vencido pela dupla nos sets</strong>, também com máximo de <strong>6 games pontuáveis por set</strong>.<br><br><strong>Exemplo de set com tie-break:</strong><br>7×6 / 6×4 → o primeiro set pontua como <strong>6×6</strong>. Cada vencedor: 10 + 6 + 6 = <strong>22 pontos</strong>. Cada perdedor: 6 + 6 + 4 = <strong>16 pontos</strong>. O placar real 7×6 é preservado, mas o 7º game não aumenta a parcela de games.<br><br><strong>Exemplo com match tie-break:</strong><br>6×4 / 3×6 / Match TB 10×7 → a dupla que vence o match tie-break vence a partida. Cada vencedor recebe 10 + 6 + 3 = <strong>19 pontos</strong>; cada perdedor recebe 6 + 4 + 6 = <strong>16 pontos</strong>. Portanto, a pontuação final por atleta é <strong>19 × 16</strong>. O 10×7 do match tie-break <strong>não soma games nem pontos</strong>.<br><br><strong>Outro cenário:</strong><br>4×6 / 6×2 / Match TB 12×10 → vencedores do match tie-break: 10 + 4 + 6 = <strong>20 pontos por atleta</strong>; perdedores: 6 + 6 + 2 = <strong>14 pontos por atleta</strong>. O 12×10 apenas decide quem venceu.<br><br><strong>Desempate do ranking:</strong><br>1) saldo de games; 2) confronto direto; 3) número de vitórias; 4) TBD. O match tie-break não entra no saldo nem na pontuação por games.';else a='<strong>O sorteio não é aleatório puro.</strong><ol class="steps"><li>Você escolhe a data. Em quarta-feira, a disponibilidade vem da Agenda oficial.</li><li>Define quem está elegível.</li><li>Escolhe Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolhe a composição.</li><li>O motor remove confrontos já realizados.</li><li>No Simples, prioriza quem tem menos jogos de Simples; nas Duplas, quem tem menos jogos de Duplas.</li><li>Evita sobreposição do mesmo atleta na composição.</li><li>Busca as melhores soluções válidas.</li><li>Só então usa aleatoriedade entre soluções equivalentes.</li></ol>O sorteio não altera ranking, resultados, agenda ou disponibilidade. <strong>As regras vêm antes da sorte.</strong><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';setTimeout(()=>add(a),100)}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
