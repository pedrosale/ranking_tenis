<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segunda Sagrada · Árbitro IA Preview</title><style>:root{--cream:#f4ead7;--muted:rgba(244,234,215,.66);--gold:#d9b878;--line:rgba(244,234,215,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--cream);background:radial-gradient(circle at 12% 8%,rgba(191,113,74,.22),transparent 28%),radial-gradient(circle at 86% 14%,rgba(31,95,59,.20),transparent 30%),linear-gradient(145deg,#17110d 0%,#241611 48%,#102419 100%)}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.badge{border:1px solid rgba(217,184,120,.28);background:rgba(217,184,120,.08);padding:8px 11px;border-radius:999px;font-size:11px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(255,248,236,.075),rgba(255,248,236,.03));box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden}.hero{padding:24px 22px 18px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}h1{font-family:Georgia,serif;font-size:34px;line-height:1;margin:8px 0}.sub{margin:0;color:var(--muted);line-height:1.5;font-size:14px}.quick{padding:18px 18px 6px}.quick h2{font-size:13px;margin:0 0 11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid rgba(217,184,120,.28);background:rgba(217,184,120,.08);color:var(--cream);padding:11px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chat{padding:14px 18px 22px}.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:92%;padding:13px 15px;border-radius:18px;line-height:1.5;font-size:14px;border:1px solid var(--line)}.user .bubble{background:rgba(79,141,204,.16)}.bot .bubble{background:rgba(31,95,59,.13)}.bot .bubble strong{color:#f6ddb0}.steps{margin:10px 0 0;padding-left:20px}.steps li{margin:8px 0}.draw{display:inline-block;margin-top:12px;padding:10px 14px;border:1px solid rgba(217,184,120,.34);border-radius:999px;color:var(--gold);text-decoration:none;font-weight:800;font-size:12px;background:rgba(217,184,120,.06)}.note{padding:0 18px 20px;color:var(--muted);font-size:11px;text-align:center}</style></head><body><div class="wrap"><div class="top"><div class="brand">Segunda Sagrada · Preview</div><div class="badge">Árbitro IA</div></div><section class="card"><div class="hero"><div class="eyebrow">Pergunte ao Árbitro</div><h1>O que você quer saber?</h1><p class="sub">O Árbitro orienta como organizar a rodada usando as ferramentas do app.</p></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário?</button></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Olá! Escolha uma das perguntas acima.</div></div></div><div class="note">Preview da experiência do Árbitro da Segunda Sagrada.</div></section></div><script>const chat=document.getElementById('chat');function addMsg(text,who='bot'){const row=document.createElement('div');row.className='msg '+who;const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=text;row.appendChild(bubble);chat.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'end'})}function ask(type){if(type==='jogos'){addMsg('Quem vai jogar hoje?','user');setTimeout(()=>addMsg('<strong>Use o Sorteio para definir a rodada de hoje.</strong><br><br>Ele já considera as regras do campeonato, os confrontos ainda não realizados e a prioridade de quem tem menos jogos. Se a data escolhida for uma quarta-feira, também aplica automaticamente a disponibilidade cadastrada na Agenda.<br><br><strong>Como usar:</strong><ol class="steps"><li>Abra o <strong>Sorteio</strong>.</li><li>Escolha a <strong>data da rodada</strong>.</li><li>Escolha se quer <strong>Só Simples</strong>, <strong>Só Duplas</strong> ou <strong>Simples + Duplas</strong>.</li><li>Escolha a <strong>composição</strong> desejada para a rodada.</li><li>Confira os atletas disponíveis. Em quartas-feiras, quem estiver indisponível na Agenda já ficará fora.</li><li>Se quiser, desmarque manualmente algum atleta que não participará.</li><li>Toque na <strong>sacolinha</strong> para sortear.</li></ol>O resultado respeita as regras do motor e evita repetir jogos já realizados.<br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>','bot'),150)}else{addMsg('Qual horário?','user');setTimeout(()=>addMsg('A ordem dos jogos fica a critério de vocês.<br><br>Para saber o <strong>horário em que começam os jogos</strong>, consulte o Renato.','bot'),150)}}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
