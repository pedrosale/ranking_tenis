SSSAaN9jrspyszC43SSQAU1GyXxN8LvkUBNTyRHxN06hJJAVEW3USNUkkGpkb4sylMM0R+KSSQDwD8e/RqFxB15rdBZJJOFQd0kklSX//Z"><div><div class="eyebrow">João AI</div><h1>Fala comigo 🎾</h1><p class="sub">Posso orientar a rodada e explicar as regras de pontuação e sorteio da Segunda Sagrada.</p></div></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><button class="chip" data-q="jogos">Quais os jogos de hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Fala! Eu sou o João AI. Escolhe uma pergunta aí 👇</div></div></div><div class="note">Preview da experiência do João AI dentro da Segunda Sagrada.</div></section></div><script>
const chat=document.getElementById('chat');
function addMsg(text,who='bot'){const row=document.createElement('div');row.className='msg '+who;const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=text;row.appendChild(bubble);chat.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'end'})}
function ask(type){const q={jogos:'Quais os jogos de hoje?',horario:'Qual horário dos jogos?',simples:'Qual regra de pontuação do Simples?',duplas:'Qual regra de pontuação de Duplas?',sorteio:'Como funciona o sorteio?'}[type];addMsg(q,'user');let a='';
if(type==='jogos')a='<strong>Primeiro, descubra quem pode jogar hoje.</strong><br><br>Se <strong>não for uma quarta-feira</strong>, pergunte no grupo quem está disponível para jogar hoje.<br><br>Se <strong>for quarta-feira</strong>, pode ir direto para o Sorteio: ele usa automaticamente a disponibilidade cadastrada na Agenda oficial.<br><br>Sabendo quem está disponível, <strong>use o Sorteio para definir a rodada de hoje.</strong> Ele já considera as regras do campeonato, os confrontos ainda não realizados e a prioridade de quem tem menos jogos.<br><br><strong>Como usar:</strong><ol class="steps"><li>Abra o <strong>Sorteio</strong>.</li><li>Escolha a <strong>data da rodada</strong>.</li><li>Escolha <strong>Só Simples</strong>, <strong>Só Duplas</strong> ou <strong>Simples + Duplas</strong>.</li><li>Escolha a <strong>composição</strong>.</li><li>Confira os atletas disponíveis. Em quartas-feiras, quem estiver indisponível na Agenda já fica fora.</li><li>Se quiser, desmarque manualmente quem não vai participar.</li><li>Toque na <strong>sacolinha</strong> para sortear.</li></ol>O resultado respeita as regras do motor e evita repetir jogos já realizados.<br><a class="draw" href="https://pedrosale.github.io/ranking_tenis/sorteio.html">Abrir o Sorteio →</a>';
else if(type==='horario')a='<strong>Horários dos jogos:</strong><br><br><strong>Se for Rodada Simples:</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br>Jogo 03 — 21h<br><br><strong>Se for Rodada de Duplas:</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h30<br><br><strong>Se for Rodada Mista (Simples/Duplas):</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br><br><strong>Independentemente da seleção:</strong><br>Respeitem os <strong>5 minutos de aquecimento</strong>.<br><br>Em caso de atraso, a regra é: <strong>10 minutos de tolerância + 5 minutos de aquecimento.</strong>';
else if(type==='simples')a='<strong>Simples:</strong><br><br>• Vitória: <strong>10 pontos-base</strong> + games vencidos, com teto de 8 games para a parcela variável.<br>• Derrota: <strong>6 pontos-base</strong> + games vencidos, também com teto de 8 games.<br><br>Exemplo: venceu por 8×5 → 18 pontos para o vencedor e 11 para o perdedor.<br><br>O match tie-break, quando houver, define o vencedor, mas não entra como game normal no saldo.';
else if(type==='duplas')a='<strong>Duplas:</strong><br><br>• Cada atleta da dupla vencedora recebe <strong>10 pontos-base</strong> + os games vencidos pela dupla nos 2 sets, limitados a 6 por set.<br>• Cada atleta da dupla derrotada recebe <strong>6 pontos-base</strong> + os games vencidos pela dupla nos 2 sets, também limitados a 6 por set.<br><br>O match tie-break, quando usado para decidir um 1×1 em sets, define o vencedor, mas não entra no saldo de games.';
else a='<strong>O sorteio não é aleatório puro.</strong><br><br>Ele funciona como um organizador inteligente da rodada. Primeiro o sistema monta o universo de confrontos que ainda podem acontecer e só depois usa a aleatoriedade para escolher entre as soluções válidas.<br><br><strong>Passo a passo do motor:</strong><ol class="steps"><li><strong>Data:</strong> você escolhe o dia da rodada. Se for quarta-feira, o sistema consulta automaticamente a disponibilidade oficial cadastrada no Geral.</li><li><strong>Atletas elegíveis:</strong> quem estiver indisponível naquela quarta já fica fora. Nos outros dias, você pode selecionar manualmente quem participará.</li><li><strong>Modalidade:</strong> você escolhe Só Simples, Só Duplas ou Simples + Duplas.</li><li><strong>Composição:</strong> o sistema oferece apenas combinações compatíveis com a quantidade de atletas selecionados.</li><li><strong>Jogos já realizados:</strong> o motor remove os confrontos que já aconteceram.</li><li><strong>Prioridade:</strong> para Simples, favorece quem tem menos jogos de Simples; para Duplas, quem tem menos jogos de Duplas.</li><li><strong>Sem sobreposição:</strong> o mesmo atleta não aparece em dois confrontos diferentes na mesma composição.</li><li><strong>Melhor solução:</strong> o sistema tenta atender a composição pedida e manter a distribuição equilibrada.</li><li><strong>Acaso por último:</strong> somente entre soluções equivalentes entra a aleatoriedade.</li></ol><strong>Importante:</strong> o sorteio não altera ranking, resultados, agenda nem disponibilidade.<br><br>Em resumo: <strong>as regras vêm antes da sorte.</strong><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';
setTimeout(()=>addMsg(a,'bot'),120)}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script></body></html>
