<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segunda Sagrada · João AI Preview</title><style>:root{--cream:#f4ead7;--muted:rgba(244,234,215,.66);--gold:#d9b878;--line:rgba(244,234,215,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--cream);background:radial-gradient(circle at 12% 8%,rgba(191,113,74,.22),transparent 28%),radial-gradient(circle at 86% 14%,rgba(31,95,59,.20),transparent 30%),linear-gradient(145deg,#17110d 0%,#241611 48%,#102419 100%)}.wrap{max-width:820px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.badge{border:1px solid rgba(217,184,120,.28);background:rgba(217,184,120,.08);padding:8px 11px;border-radius:999px;font-size:11px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(255,248,236,.075),rgba(255,248,236,.03));box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden}.hero{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:22px;border-bottom:1px solid var(--line)}.avatar{width:120px;height:120px;border-radius:24px;object-fit:cover;border:1px solid rgba(217,184,120,.24);box-shadow:0 12px 35px rgba(0,0,0,.24)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}h1{font-family:Georgia,serif;font-size:34px;line-height:1;margin:8px 0}.sub{margin:0;color:var(--muted);line-height:1.5;font-size:14px}.quick{padding:18px 18px 6px}.quick h2{font-size:13px;margin:0 0 11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid rgba(217,184,120,.28);background:rgba(217,184,120,.08);color:var(--cream);padding:11px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chat{padding:14px 18px 22px}.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:94%;padding:13px 15px;border-radius:18px;line-height:1.5;font-size:14px;border:1px solid var(--line)}.user .bubble{background:rgba(79,141,204,.16)}.bot .bubble{background:rgba(31,95,59,.13)}.bot .bubble strong{color:#f6ddb0}.steps{margin:10px 0 0;padding-left:20px}.steps li{margin:8px 0}.draw{display:inline-block;margin-top:12px;padding:10px 14px;border:1px solid rgba(217,184,120,.34);border-radius:999px;color:var(--gold);text-decoration:none;font-weight:800;font-size:12px;background:rgba(217,184,120,.06)}.note{padding:0 18px 20px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:560px){.hero{grid-template-columns:82px 1fr}.avatar{width:82px;height:82px;border-radius:18px}h1{font-size:29px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Segunda Sagrada · Preview</div><div class="badge">João AI</div></div><section class="card"><div class="hero"><img class="avatar" alt="João AI" src="./assets/joao-ai.svg?v=4"><div><div class="eyebrow">João AI</div><h1>Fala comigo 🎾</h1><p class="sub">Posso orientar a rodada e explicar as regras de pontuação e sorteio da Segunda Sagrada.</p></div></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><button class="chip" data-q="jogos">Quais os jogos de hoje?</button><button class="chip" data-q="horario">Qual horário?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Fala! Eu sou o João AI. Escolhe uma pergunta aí 👇</div></div></div><div class="note">Preview da experiência do João AI dentro da Segunda Sagrada.</div></section></div><script>const chat=document.getElementById('chat');function addMsg(text,who='bot'){const row=document.createElement('div');row.className='msg '+who;const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=text;row.appendChild(bubble);chat.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'end'})}function ask(type){const q={jogos:'Quais os jogos de hoje?',horario:'Qual horário?',simples:'Qual regra de pontuação do Simples?',duplas:'Qual regra de pontuação de Duplas?',sorteio:'Como funciona o sorteio?'}[type];addMsg(q,'user');let a='';if(type==='jogos')a='<strong>Primeiro, descubra quem pode jogar hoje.</strong><br><br>Se <strong>não for uma quarta-feira</strong>, pergunte no grupo quem está disponível para jogar hoje.<br><br>Se <strong>for quarta-feira</strong>, pode ir direto para o Sorteio: ele usa automaticamente a disponibilidade cadastrada na Agenda oficial.<br><br>Sabendo quem está disponível, <strong>use o Sorteio para definir a rodada de hoje.</strong> Ele já considera as regras do campeonato, os confrontos ainda não realizados e a prioridade de quem tem menos jogos.<br><br><strong>Como usar:</strong><ol class="steps"><li>Abra o <strong>Sorteio</strong>.</li><li>Escolha a <strong>data da rodada</strong>.</li><li>Escolha <strong>Só Simples</strong>, <strong>Só Duplas</strong> ou <strong>Simples + Duplas</strong>.</li><li>Escolha a <strong>composição</strong>.</li><li>Confira os atletas disponíveis. Em quartas-feiras, quem estiver indisponível na Agenda já fica fora.</li><li>Se quiser, desmarque manualmente quem não vai participar.</li><li>Toque na <strong>sacolinha</strong> para sortear.</li></ol>O resultado respeita as regras do motor e evita repetir jogos já realizados.<br><a class="draw" href="https://pedrosale.github.io/ranking_tenis/sorteio.html">Abrir o Sorteio →</a>';else if(type==='horario')a='A ordem dos jogos fica a critério de vocês.<br><br>Para saber o <strong>horário em que começam os jogos</strong>, consulte o Renato.';else if(type==='simples')a='<strong>Simples:</strong><br><br>• Vitória: <strong>10 pontos-base</strong> + games vencidos, com teto de 8 games para a parcela variável.<br>• Derrota: <strong>6 pontos-base</strong> + games vencidos, também com teto de 8 games.<br><br>Exemplo: venceu por 8×5 → 18 pontos para o vencedor e 11 para o perdedor.<br><br>O match tie-break, quando houver, define o vencedor, mas não entra como game normal no saldo.';else if(type==='duplas')a='<strong>Duplas:</strong><br><br>• Cada atleta da dupla vencedora recebe <strong>10 pontos-base</strong> + os games vencidos pela dupla nos 2 sets, limitados a 6 por set.<br>• Cada atleta da dupla derrotada recebe <strong>6 pontos-base</strong> + os games vencidos pela dupla nos 2 sets, também limitados a 6 por set.<br><br>O match tie-break, quando usado para decidir um 1×1 em sets, define o vencedor, mas não entra no saldo de games.';else a='<strong>O sorteio não é aleatório puro.</strong><br><br>Ele funciona como um organizador inteligente da rodada. Primeiro o sistema monta o universo de confrontos que ainda podem acontecer e só depois usa a aleatoriedade para escolher entre as soluções válidas.<br><br><strong>Passo a passo do motor:</strong><ol class="steps"><li><strong>Data:</strong> você escolhe o dia da rodada. Se for quarta-feira, o sistema consulta automaticamente a disponibilidade oficial cadastrada no Geral.</li><li><strong>Atletas elegíveis:</strong> quem estiver indisponível naquela quarta já fica fora. Nos outros dias, você pode selecionar manualmente quem participará.</li><li><strong>Modalidade:</strong> você escolhe Só Simples, Só Duplas ou Simples + Duplas.</li><li><strong>Composição:</strong> o sistema oferece apenas combinações compatíveis com a quantidade de atletas selecionados, por exemplo 1 Simples + 1 Duplas.</li><li><strong>Jogos já realizados:</strong> o motor remove os confrontos que já aconteceram. No Simples, ele protege tanto pelo ID quanto pelo par de adversários. Em Duplas, considera a grade oficial de confrontos pendentes.</li><li><strong>Prioridade:</strong> para Simples, favorece quem tem menos jogos de Simples; para Duplas, quem tem menos jogos de Duplas.</li><li><strong>Sem sobreposição:</strong> na mesma composição, o mesmo atleta não deve aparecer em dois confrontos diferentes. Em rodada mista, quem joga Simples não é usado também em Duplas naquela composição.</li><li><strong>Melhor solução:</strong> o sistema tenta atender a composição pedida, usar bem os atletas disponíveis e manter a distribuição de jogos equilibrada.</li><li><strong>Acaso por último:</strong> somente entre soluções equivalentes o sorteio usa aleatoriedade para decidir.</li></ol><strong>Importante:</strong> tocar na sacolinha não altera ranking, resultados, agenda nem disponibilidade. O sorteio serve apenas para planejar a rodada.<br><br>Em resumo: <strong>as regras vêm antes da sorte.</strong><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';setTimeout(()=>addMsg(a,'bot'),120)}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
