ientar a rodada e explicar as regras da Segunda Sagrada.</p></div></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="gerais">Quais são as regras gerais?</button></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Fala! Eu sou o João AI. Escolhe uma pergunta aí 👇</div></div></div><div class="note">Preview da experiência do João AI dentro da Segunda Sagrada.</div></section></div><script>const chat=document.getElementById('chat');function add(t,w='bot'){const r=document.createElement('div');r.className='msg '+w;const b=document.createElement('div');b.className='bubble';b.innerHTML=t;r.appendChild(b);chat.appendChild(r);r.scrollIntoView({behavior:'smooth',block:'end'})}const Q={jogos:'Quem vai jogar hoje?',horario:'Qual horário dos jogos?',simples:'Qual regra de pontuação do Simples?',duplas:'Qual regra de pontuação de Duplas?',sorteio:'Como funciona o sorteio?',gerais:'Quais são as regras gerais?'};function ask(x){add(Q[x],'user');let a='';if(x==='jogos')a='<strong>Primeiro, descubra quem pode jogar hoje.</strong><br><br>Se não for uma quarta-feira, pergunte no grupo quem está disponível. Se for quarta-feira, pode ir direto para o Sorteio: ele usa a disponibilidade cadastrada na Agenda oficial.<br><br>Sabendo quem está disponível, <strong>use o Sorteio para definir a rodada.</strong><ol class="steps"><li>Abra o Sorteio.</li><li>Escolha a data.</li><li>Escolha Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolha a composição.</li><li>Confira os atletas disponíveis.</li><li>Se quiser, desmarque manualmente quem não vai participar.</li><li>Toque na sacolinha.</li></ol>O motor respeita as regras e evita jogos já realizados.<br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';else if(x==='horario')a='<strong>Rodada Simples</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br>Jogo 03 — 21h<br><br><strong>Rodada Duplas</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h30<br><br><strong>Rodada Mista (Simples/Duplas)</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br><br><strong>Para qualquer formato:</strong><br>Respeitem os <strong>5 minutos de aquecimento</strong>.<br>Em caso de atraso, a regra é <strong>10 minutos de tolerância + 5 minutos de aquecimento</strong>.<br><br>Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os participantes trocas na ordem dos jogos, desde que isso <strong>não atrase a agenda geral</strong>.';else if(x==='gerais')a='<strong>Regras gerais da rodada</strong><br><br>• Respeitem os <strong>5 minutos de aquecimento</strong> antes de cada jogo.<br>• Em caso de atraso, há <strong>10 minutos de tolerância</strong> e, depois, os <strong>5 minutos de aquecimento</strong>.<br>• Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os demais participantes uma troca na ordem dos jogos, desde que a mudança <strong>não atrase a agenda geral da rodada</strong>.<br>• A organização dos jogos deve preservar os horários previstos e o bom andamento da rodada.';else if(x==='simples')a='<strong>Simples — como funciona a pontuação</strong><br><br>• <strong>Vencedor:</strong> recebe 10 pontos-base + 1 ponto por game vencido, conforme a regra de pontuação do Simples.<br>• <strong>Perdedor:</strong> recebe 6 pontos-base + 1 ponto por game vencido, conforme a regra de pontuação do Simples.<br><br><strong>Exemplo direto:</strong><br>Placar 8×5 → vencedor: 10 + 8 = <strong>18 pontos</strong>; perdedor: 6 + 5 = <strong>11 pontos</strong>.<br><br><strong>E quando há tie-break?</strong><br>O tie-break serve para decidir o set/partida conforme o formato do jogo. O placar real é preservado, mas a pontuação segue a regra de games pontuáveis do sistema — o tie-break não vira uma quantidade extra de games nem gera ponto-extra separado só por ter sido vencido.<br><br><strong>Exemplo:</strong> se o placar oficial registrado equivaler a 8×7 após tie-break, a pontuação é calculada pelos games registrados/pontuáveis da partida, e não pelos pontos internos do tie-break (7×5, 10×8 etc.).';else if(x==='duplas')a='<strong>Duplas — regra oficial do sistema</strong><br><br><strong>Vencedores · 10 + games</strong><br>Cada atleta da dupla vencedora recebe <strong>10 pontos de base + 1 ponto por game vencido pela dupla nos sets</strong>, com máximo de <strong>6 games pontuáveis por set</strong>. O placar real é preservado.<br><br><strong>Perdedores · 6 + games</strong><br>Cada atleta da dupla perdedora recebe <strong>6 pontos de base + 1 ponto por game vencido pela dupla nos sets</strong>, também com máximo de <strong>6 games pontuáveis por set</strong>.<br><br><strong>Exemplos:</strong><br>• Set 7×5 → para pontuação por games, conta como <strong>6×5</strong>.<br>• Set 7×6 → conta como <strong>6×6</strong>.<br>• Partida 6×4 / 6×3 → cada vencedor recebe 10 + 12 = <strong>22 pontos</strong>; cada perdedor recebe 6 + 7 = <strong>13 pontos</strong>.<br><br><strong>Match tie-break:</strong><br>Se a partida ficar <strong>1×1 em sets</strong>, o match tie-break decide quem venceu, mas <strong>seus pontos não contam como games</strong> e não existe ponto-extra por vencer o tie-break.<br><br><strong>Exemplo com match tie-break:</strong><br>6×4 / 3×6 / Match TB 10×7. A dupla que venceu o match tie-break é a vencedora da partida. Para a pontuação, porém, entram somente os games dos dois sets: vencedores = 10 + 6 + 3 = <strong>19 pontos por atleta</strong>; perdedores = 6 + 4 + 6 = <strong>16 pontos por atleta</strong>. O 10×7 do match tie-break não soma games nem pontos.<br><br><strong>Desempate do ranking:</strong><br>1) saldo de games; 2) confronto direto; 3) número de vitórias; 4) TBD. O match tie-break não entra no saldo nem na pontuação por games.';else a='<strong>O sorteio não é aleatório puro.</strong><ol class="steps"><li>Você escolhe a data. Em quarta-feira, a disponibilidade vem da Agenda oficial.</li><li>Define quem está elegível.</li><li>Escolhe Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolhe a composição.</li><li>O motor remove confrontos já realizados.</li><li>No Simples, prioriza quem tem menos jogos de Simples; nas Duplas, quem tem menos jogos de Duplas.</li><li>Evita sobreposição do mesmo atleta na composição.</li><li>Busca as melhores soluções válidas.</li><li>Só então usa aleatoriedade entre soluções equivalentes.</li></ol>O sorteio não altera ranking, resultados, agenda ou disponibilidade. <strong>As regras vêm antes da sorte.</strong><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';setTimeout(()=>add(a),100)}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
