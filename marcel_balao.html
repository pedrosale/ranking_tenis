<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Marcel do Balão · Segunda Sagrada</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102018;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}.wrap{max-width:520px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.back{color:#f3d58f;text-decoration:none;border:1px solid #f3d58f66;border-radius:999px;padding:8px 11px;font-size:12px}.score{font-weight:800;color:#f3d58f}.card{background:#172a20;border:1px solid #ffffff22;border-radius:22px;padding:10px;box-shadow:0 12px 35px #0005}h1{font-family:Georgia,serif;font-size:25px;margin:6px 4px 2px}.sub{margin:0 4px 10px;color:#c9d0c8;font-size:13px}canvas{display:block;width:100%;aspect-ratio:9/14;background:#5d8b68;border-radius:16px;touch-action:none}.controls{display:flex;gap:10px;margin-top:10px}.btn{flex:1;border:1px solid #f3d58f66;background:#f3d58f18;color:#fff;border-radius:15px;padding:14px;font-size:16px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.start{width:100%;margin-top:10px;border:0;background:#f3d58f;color:#172016;border-radius:15px;padding:13px;font-weight:900;font-size:15px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tip{text-align:center;color:#bfc9bf;font-size:12px;margin:10px 4px 2px}</style></head><body><div class="wrap"><div class="top"><a class="back" href="./master.html">← Geral</a><div class="score">DEVOLUÇÕES: <span id="score">0</span></div></div><div class="card"><h1>Marcel do Balão 🎾</h1><p class="sub">O Marcel só quer uma coisa: mandar balão. Chegue na bola e devolva antes do segundo quique.</p><canvas id="game" width="450" height="700"></canvas><div class="controls"><button class="btn" id="left">◀ ESQUERDA</button><button class="btn" id="right">DIREITA ▶</button></div><button class="start" id="start">COMEÇAR / RECOMEÇAR</button><div class="tip">Segure ◀ ou ▶ para correr. A raquetada é automática quando você alcança a bola.</div></div></div><script>const cv=document.getElementById('game'),x=cv.getContext('2d'),scoreEl=document.getElementById('score');let W=cv.width,H=cv.height,run=false,score=0,last=0,left=false,right=false,phase='marcel',bounce=0,flash=0;const player={x:225,y:610,w:34,h:45,s:270};const marcel={x:225,y:92};const ball={x:225,y:130,vx:0,vy:0,r:8};function reset(){score=0;scoreEl.textContent=0;player.x=225;run=true;serve()}function serve(){phase='toPlayer';bounce=0;ball.x=marcel.x+(Math.random()*40-20);ball.y=135;let target=55+Math.random()*340;let T=1.55+Math.random()*.45;ball.vx=(target-ball.x)/T;ball.vy=-420;flash=0}function returnBall(){score++;scoreEl.textContent=score;phase='toMarcel';bounce=0;ball.vx=(marcel.x-ball.x)/1.0;ball.vy=-610;flash=10;setTimeout(()=>{if(run)serve()},900)}function lose(){run=false;flash=-35}function update(dt){if(!run)return;if(left)player.x-=player.s*dt;if(right)player.x+=player.s*dt;player.x=Math.max(28,Math.min(W-28,player.x));if(phase==='toPlayer'){ball.vy+=620*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y>555&&ball.vy>0){bounce++;ball.y=555;ball.vy=-Math.abs(ball.vy)*.52;if(bounce>=2)lose()}let dx=Math.abs(ball.x-player.x),dy=Math.abs(ball.y-player.y+22);if(dx<35&&dy<48&&ball.vy>0)returnBall()}else if(phase==='toMarcel'){ball.vy+=500*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt}if(flash>0)flash--}function court(){x.fillStyle='#548663';x.fillRect(0,0,W,H);x.strokeStyle='#f6f0da';x.lineWidth=4;x.strokeRect(28,42,W-56,H-78);x.beginPath();x.moveTo(28,H/2);x.lineTo(W-28,H/2);x.stroke();x.lineWidth=2;x.beginPath();x.moveTo(W/2,42);x.lineTo(W/2,H-36);x.moveTo(28,225);x.lineTo(W-28,225);x.moveTo(28,475);x.lineTo(W-28,475);x.stroke();x.fillStyle='#263b31';x.fillRect(16,H/2-5,W-32,10);x.fillStyle='#eee';for(let i=18;i<W-18;i+=18)x.fillRect(i,H/2-4,10,2)}function person(px,py,shirt,name,big=false){x.save();x.translate(px,py);x.fillStyle='#d7a27c';x.beginPath();x.arc(0,-22,big?17:13,0,Math.PI*2);x.fill();x.fillStyle=shirt;x.fillRect(big?-19:-15,-8,big?38:30,big?38:32);x.fillStyle='#222';x.fillRect(big?-18:-14,30,big?13:10,25);x.fillRect(big?5:4,30,big?13:10,25);x.strokeStyle='#ddd';x.lineWidth=4;x.beginPath();x.moveTo(big?18:14,2);x.lineTo(big?35:28,-10);x.stroke();x.strokeStyle='#222';x.lineWidth=3;x.beginPath();x.ellipse(big?40:33,-15,9,17,.5,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.font='bold 12px Arial';x.textAlign='center';x.fillText(name,0,big?72:64);x.restore()}function draw(){court();person(marcel.x,marcel.y,'#161616','MARCEL',true);person(player.x,player.y,'#e8e5d8','VOCÊ');if(phase==='toPlayer'&&run){x.strokeStyle='#ffffff35';x.setLineDash([5,7]);x.beginPath();x.moveTo(marcel.x,130);x.quadraticCurveTo((marcel.x+ball.x)/2,60,ball.x,ball.y);x.stroke();x.setLineDash([])}x.fillStyle='#dfff26';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.lineWidth=1;x.stroke();if(!run){x.fillStyle='#0009';x.fillRect(45,260,W-90,155);x.fillStyle='#fff';x.textAlign='center';x.font='bold 25px Georgia';x.fillText(score===0?'Preparado?':'O BALÃO TE PEGOU! 😄',W/2,310);x.font='bold 17px Arial';x.fillStyle='#f3d58f';x.fillText(score+' devoluções',W/2,345);x.font='14px Arial';x.fillStyle='#ddd';x.fillText('Toque em COMEÇAR para jogar',W/2,382)}if(flash>0){x.fillStyle='#fff8';x.fillRect(0,0,W,H)}}function loop(t){let dt=Math.min(.03,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function hold(el,key){el.addEventListener('pointerdown',e=>{e.preventDefault();if(key==='l')left=true;else right=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();if(key==='l')left=false;else right=false}));el.addEventListener('contextmenu',e=>e.preventDefault());el.addEventListener('selectstart',e=>e.preventDefault())}hold(document.getElementById('left'),'l');hold(document.getElementById('right'),'r');const startBtn=document.getElementById('start');startBtn.onclick=reset;startBtn.addEventListener('contextmenu',e=>e.preventDefault());startBtn.addEventListener('selectstart',e=>e.preventDefault());window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});requestAnimationFrame(loop);</script></body></html>
