<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segunda Sagrada · João AI</title><style>:root{--cream:#f4ead7;--muted:#b9ad9f;--gold:#d9b878;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--cream);background:linear-gradient(145deg,#17110d,#241611 48%,#102419)}.wrap{max-width:820px;margin:auto;padding:22px 14px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.badge,.chip,.draw,.back{border:1px solid #d9b87855;background:#d9b87812;color:var(--cream);border-radius:999px}.badge{padding:8px 11px;font-size:11px}.back{display:inline-block;padding:8px 11px;text-decoration:none;font-size:11px;font-weight:800}.card{border:1px solid var(--line);border-radius:26px;background:#ffffff0b;overflow:hidden}.hero{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:22px;border-bottom:1px solid var(--line)}.avatar{width:120px;height:120px;border-radius:24px;object-fit:cover;border:1px solid #d9b87855}h1{font-family:Georgia,serif;font-size:34px;margin:8px 0}.sub{color:var(--muted);line-height:1.5}.quick{padding:18px 18px 6px}.quick h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip-col{display:flex;flex-direction:column;gap:8px}.chip{padding:11px 14px;cursor:pointer;font-weight:700;text-align:left}@media(max-width:640px){.chips{grid-template-columns:1fr 1fr;gap:8px}.chip{padding:10px 11px;font-size:12px}}.chat{padding:14px 18px 22px}.msg{display:flex;margin:10px 0}.user{justify-content:flex-end}.bubble{max-width:94%;padding:13px 15px;border-radius:18px;line-height:1.55;border:1px solid var(--line)}.user .bubble{background:#4f8dcc29}.bot .bubble{background:#1f5f3b21}strong{color:#f6ddb0}.steps{padding-left:20px}.steps li{margin:7px 0}.draw{display:inline-block;margin-top:12px;padding:10px 14px;color:var(--gold);text-decoration:none;font-weight:800}.note{padding:0 18px 20px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:560px){.top{align-items:flex-start}.top-left{gap:7px}.hero{grid-template-columns:82px 1fr}.avatar{width:82px;height:82px;border-radius:18px}h1{font-size:29px}}</style></head><body><div class="wrap"><div class="top"><div class="top-left"><a class="back" href="./master.html">← Voltar para Geral</a><div class="brand">Segunda Sagrada</div></div><div class="badge">João AI</div></div><section class="card"><div class="hero"><img class="avatar" alt="João AI" src="./assets/joao-ai-final.jpg?v=4"><div><div class="eyebrow">João AI</div><h1>Fala comigo 🎾</h1><p class="sub">Posso orientar a rodada e explicar as regras da Segunda Sagrada.</p></div></div><div class="quick"><h2>Perguntas rápidas</h2><div class="chips"><div class="chip-col"><button class="chip" data-q="gerais">Quais são as regras gerais?</button><button class="chip" data-q="simples">Qual regra de pontuação do Simples?</button><button class="chip" data-q="duplas">Qual regra de pontuação de Duplas?</button><button class="chip" data-q="finais">Como serão as finais?</button></div><div class="chip-col"><button class="chip" data-q="jogos">Quem vai jogar hoje?</button><button class="chip" data-q="sorteio">Como funciona o sorteio?</button><button class="chip" data-q="horario">Qual horário dos jogos?</button><button class="chip" data-q="etiqueta">Quais as regras de etiqueta?</button></div></div></div><div class="chat" id="chat"><div class="msg bot"><div class="bubble">Fala! Eu sou o João AI. Escolhe uma pergunta aí 👇</div></div></div><div class="note">João AI · Segunda Sagrada</div></section></div><script>const c=document.getElementById('chat');function add(t,w='bot'){let r=document.createElement('div');r.className='msg '+w;r.innerHTML='<div class="bubble">'+t+'</div>';c.appendChild(r);r.scrollIntoView({behavior:'smooth'})}const Q={jogos:'Quem vai jogar hoje?',horario:'Qual horário dos jogos?',simples:'Qual regra de pontuação do Simples?',duplas:'Qual regra de pontuação de Duplas?',finais:'Como serão as finais?',sorteio:'Como funciona o sorteio?',etiqueta:'Quais as regras de etiqueta?',gerais:'Quais são as regras gerais?'};function ask(x){add(Q[x],'user');let a='';if(x==='jogos')a='<strong>Primeiro, descubra quem pode jogar hoje.</strong><br><br>Se não for uma quarta-feira, pergunte no grupo quem está disponível. Se for quarta-feira, pode ir direto para o Sorteio: ele usa a disponibilidade cadastrada na Agenda oficial.<br><br>Sabendo quem está disponível, <strong>use o Sorteio para definir a rodada.</strong><ol class="steps"><li>Abra o Sorteio.</li><li>Escolha a data.</li><li>Escolha Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolha a composição.</li><li>Confira os atletas disponíveis.</li><li>Se quiser, desmarque manualmente quem não vai participar.</li><li>Toque na sacolinha.</li></ol>O motor respeita as regras e evita jogos já realizados.<br><br><button class="chip" type="button" onclick="ask(&quot;sorteio&quot;)">Como funciona o sorteio?</button><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';else if(x==='horario')a='<strong>Rodada Simples</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br>Jogo 03 — 21h<br><br><strong>Rodada Duplas</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h30<br><br><strong>Rodada Mista (Simples/Duplas)</strong><br>Jogo 01 — 19h<br>Jogo 02 — 20h<br><br><strong>Para qualquer formato:</strong><br>Respeitem os <strong>5 minutos de aquecimento</strong>.<br>Em caso de atraso, a regra é <strong>10 minutos de tolerância + 5 minutos de aquecimento</strong>.<br><br>Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os participantes trocas na ordem dos jogos, desde que isso <strong>não atrase a agenda geral</strong>.';else if(x==='etiqueta')a='<strong>🎾 Regras de etiqueta</strong><br><br>É proibido:<br>• arrotar no toss;<br>• deitar na quadra;<br>• falar <strong>acabou</strong> antes de acabar;<br>• fingir que machucou;<br>• pisar na bolinha;<br>• falar durante o jogo do amiguinho.<br><br><strong>Quem estiver assistindo ao jogo deve ajudar com as bolinhas.</strong>';else if(x==='gerais')a='<strong>Regras gerais da rodada</strong><br><br>• Respeitem os <strong>5 minutos de aquecimento</strong> antes de cada jogo.<br>• Em caso de atraso, há <strong>10 minutos de tolerância</strong> e, depois, os <strong>5 minutos de aquecimento</strong>.<br>• Em caso de <strong>atraso com aviso prévio</strong>, o atrasado pode negociar com os demais participantes uma troca na ordem dos jogos, desde que a mudança <strong>não atrase a agenda geral da rodada</strong>.<br>• A organização dos jogos deve preservar os horários previstos e o bom andamento da rodada.';else if(x==='simples')a='<strong>Simples — como funciona a pontuação</strong><br><br>• <strong>Vencedor:</strong> 10 pontos-base + 1 ponto por game vencido, com teto de <strong>8 games pontuáveis</strong>.<br>• <strong>Perdedor:</strong> 6 pontos-base + 1 ponto por game vencido, também com teto de <strong>8 games pontuáveis</strong>.<br>• Placares válidos: <strong>8×0 a 8×6, 9×7 ou 9×8</strong>.<br>• Os <strong>games e o saldo</strong> usam o placar real, mesmo quando há 9 games.<br><br><strong>Exemplo 1 — partida normal:</strong><br>Placar final <strong>8×5</strong>.<br>Vencedor: 10 + 8 = <strong>18 pontos</strong>.<br>Perdedor: 6 + 5 = <strong>11 pontos</strong>.<br>Saldo: <strong>+3</strong> para o vencedor e <strong>−3</strong> para o perdedor.<br><br><strong>Exemplo 2 — extremo sem tie-break:</strong><br>Se a partida chega a <strong>7×7</strong>, ela continua normalmente. Se um atleta abrir dois games, pode terminar <strong>9×7</strong>.<br>Vencedor: 10 + min(8, 9) = <strong>18 pontos</strong>.<br>Perdedor: 6 + 7 = <strong>13 pontos</strong>.<br>O placar real 9×7 entra no saldo: <strong>+2</strong> para o vencedor e <strong>−2</strong> para o perdedor.<br><br><strong>Exemplo 3 — extremo com tie-break:</strong><br>Se chegar a <strong>8×8</strong>, joga-se o tie-break. Quem vencer fecha a partida em <strong>9×8</strong>.<br>Vencedor: 10 + min(8, 9) = <strong>18 pontos</strong>.<br>Perdedor: 6 + min(8, 8) = <strong>14 pontos</strong>.<br>Saldo: <strong>+1</strong> para o vencedor e <strong>−1</strong> para o perdedor.<br><br>Os pontos internos do tie-break — por exemplo 7×5, 10×8 ou 12×10 — <strong>não viram games extras</strong>. Eles apenas decidem quem vence o tie-break. Para o ranking, registra-se o placar final <strong>9×8</strong>.';else if(x==='duplas')a='<strong>Duplas — como funciona a pontuação</strong><br><br>• <strong>Cada atleta da dupla vencedora:</strong> 10 pontos-base + 1 ponto por game contabilizado pela dupla nos dois sets.<br>• <strong>Cada atleta da dupla perdedora:</strong> 6 pontos-base + 1 ponto por game contabilizado pela dupla nos dois sets.<br>• Existe teto de <strong>6 games por dupla em cada set</strong> para pontuação, games e saldo do ranking. Assim, 7×5 conta como 6×5 e 7×6 conta como 6×6.<br>• Se os sets terminarem <strong>1×1</strong>, o match tie-break decide a partida, mas seus pontos <strong>não entram como games, não alteram o saldo e não acrescentam pontos</strong>.<br><br><strong>Exemplo 1 — sets normais:</strong><br>Placar <strong>6×3 / 6×4</strong>.<br>Cada vencedor: 10 + 6 + 6 = <strong>22 pontos</strong>.<br>Cada perdedor: 6 + 3 + 4 = <strong>13 pontos</strong>.<br>Saldo por atleta: <strong>+5</strong> para os vencedores e <strong>−5</strong> para os perdedores.<br><br><strong>Exemplo 2 — extremo com tie-break de set:</strong><br>Placar real <strong>7×6 / 6×4</strong>. Para o ranking, o primeiro set conta como <strong>6×6</strong>.<br>Cada vencedor: 10 + 6 + 6 = <strong>22 pontos</strong>.<br>Cada perdedor: 6 + 6 + 4 = <strong>16 pontos</strong>.<br>Saldo contabilizado: <strong>+2</strong> para cada vencedor e <strong>−2</strong> para cada perdedor.<br><br><strong>Exemplo 3 — 1×1 em sets + match tie-break:</strong><br>Placar <strong>6×4 / 3×6 / Match TB 10×8</strong>. A dupla que vence o match tie-break vence a partida.<br>Cada vencedor: 10 + 6 + 3 = <strong>19 pontos</strong>.<br>Cada perdedor: 6 + 4 + 6 = <strong>16 pontos</strong>.<br>Como o match tie-break não entra nos games, os vencedores ficam com saldo <strong>−1</strong> e os perdedores com saldo <strong>+1</strong>. É possível, portanto, vencer a partida e terminar com saldo de games negativo.<br><br><strong>Exemplo 4 — match tie-break extremo:</strong><br>Placar <strong>4×6 / 6×2 / Match TB 12×10</strong>. Mesmo com 22 pontos disputados no match tie-break, nenhum deles vira game do ranking.<br>Cada vencedor: 10 + 4 + 6 = <strong>20 pontos</strong>.<br>Cada perdedor: 6 + 6 + 2 = <strong>14 pontos</strong>.<br>O 12×10 serve apenas para definir a dupla vencedora.<br><br><strong>Desempate do ranking:</strong><br>1) saldo de games; 2) confronto direto; 3) número de vitórias; 4) ordem alfabética.';else if(x==='finais')a='<strong>🏆 Como serão as finais da Segunda Sagrada?</strong><br><br><strong>🎾 SIMPLES</strong><br><br>Ao fim da fase classificatória, os <strong>8 primeiros colocados do ranking de Simples</strong> avançam para as finais e são divididos em duas séries, de acordo com a posição final na tabela.<br><br><strong>🥇 Série Ouro — 1º ao 4º colocado</strong><br>Semifinal 1: <strong>1º × 4º</strong><br>Semifinal 2: <strong>2º × 3º</strong><br>Os vencedores das duas semifinais avançam para a <strong>Grande Final da Série Ouro</strong>.<br><br><strong>🥈 Série Prata — 5º ao 8º colocado</strong><br>Semifinal 1: <strong>5º × 8º</strong><br>Semifinal 2: <strong>6º × 7º</strong><br>Os vencedores das duas semifinais avançam para a <strong>Grande Final da Série Prata</strong>.<br><br><strong>🎾 Formato dos jogos finais de Simples</strong><br>As semifinais e finais serão disputadas em <strong>melhor de 3 sets</strong>: os dois primeiros sets são jogados normalmente até <strong>6 games</strong>. Se a partida ficar <strong>1×1 em sets</strong>, o terceiro e decisivo será um <strong>super tie-break até 10 pontos</strong>, com necessidade de diferença mínima de 2 pontos.<br><br><strong>📅 Agenda da Grande Final de Simples — quarta-feira</strong><br><strong>19h — Grande Final da Série Prata</strong><br><strong>20h30 — Grande Final da Série Ouro</strong><br><br>Assim, a temporada de Simples termina com dois títulos: <strong>Campeão da Série Prata</strong> e <strong>Campeão da Série Ouro</strong>. A Série Ouro reúne os quatro melhores da fase classificatória; a Série Prata mantém a disputa viva entre os classificados de 5º a 8º.<br><br><strong>👥 DUPLAS</strong><br><br>Ao fim da fase classificatória, os <strong>8 primeiros colocados do ranking de Duplas</strong> avançam para as finais e são divididos em duas séries, de acordo com a posição final na tabela.<br><br><strong>🥇 Série Ouro — 1º ao 4º colocado</strong><br><strong>🥈 Série Prata — 5º ao 8º colocado</strong><br><br>A Grande Final de Duplas terá uma dinâmica diferente. Os <strong>8 atletas classificados</strong> serão separados entre <strong>Série Ouro e Série Prata</strong>, e as <strong>duplas serão definidas por sorteio</strong> entre os classificados de cada série. Ou seja: a classificação define quem chega à fase final e em qual série disputa; o sorteio define as parcerias da decisão.<br><br><strong>🎾 Formato dos jogos finais de Duplas</strong><br>Os jogos serão disputados em <strong>melhor de 3 sets</strong>. Se houver <strong>1×1 em sets</strong>, o terceiro e decisivo será um <strong>super tie-break até 10 pontos</strong>, com necessidade de diferença mínima de 2 pontos.<br><br><strong>📅 Sugestão de agenda para a final de Duplas</strong><br><strong>Sábado pela manhã</strong>, transformando a decisão em um encontro especial de encerramento da temporada, seguido de um <strong>evento comemorativo da Segunda Sagrada</strong>. 🎾🏆🥂';else a='<strong>O sorteio não é aleatório puro.</strong><ol class="steps"><li>Você escolhe a data. Em quarta-feira, a disponibilidade vem da Agenda oficial.</li><li>Define quem está elegível.</li><li>Escolhe Só Simples, Só Duplas ou Simples + Duplas.</li><li>Escolhe a composição.</li><li>O motor remove confrontos já realizados.</li><li>No Simples, prioriza quem tem menos jogos de Simples; nas Duplas, quem tem menos jogos de Duplas.</li><li>Evita sobreposição do mesmo atleta na composição.</li><li>Busca as melhores soluções válidas.</li><li>Só então usa aleatoriedade entre soluções equivalentes.</li></ol>O sorteio não altera ranking, resultados, agenda ou disponibilidade. <strong>As regras vêm antes da sorte.</strong><br><a class="draw" href="./sorteio.html">Abrir o Sorteio →</a>';setTimeout(()=>add(a),100)}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
